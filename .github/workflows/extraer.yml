name: Compilar Gestoria Asistente

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar proyecto
        run: |
          ZIP=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          test -n "$ZIP"
          mkdir proyecto
          unzip -q "$ZIP" -d proyecto
          find proyecto -name settings.gradle -o -name settings.gradle.kts

      - name: Compilar APK
        run: |
          DIR=$(find proyecto -name settings.gradle -o -name settings.gradle.kts | head -n 1)
          test -n "$DIR"
          gradle -p "$(dirname "$DIR")" --no-daemon assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: GestoriaAsistente-APK
          path: proyecto/**/build/outputs/apk/debug/*.apk
