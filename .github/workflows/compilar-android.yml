name: Compilar APKs DENTAL JG desde ZIP

on:
  push:
    branches: [main]
    paths:
      - '*.zip'
      - '**/*.zip'
      - '.github/workflows/compilar-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK preinstalado
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          fi
          "$SDKMANAGER" --version

      - name: Instalar Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gradle-8.9/bin/gradle" --version

      - name: Encontrar y extraer proyecto Android
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dental_android" "$RUNNER_TEMP/dental_extract"
          FOUND=""
          while IFS= read -r -d '' archive; do
            [[ "$archive" == *".git/"* || "$archive" == *".github/"* ]] && continue
            if ! unzip -tq "$archive" >/dev/null 2>&1; then
              echo "::warning::Se omite ZIP dañado: $archive"
              continue
            fi
            target="$RUNNER_TEMP/dental_extract/$(basename "$archive" .zip)"
            mkdir -p "$target"
            unzip -oq "$archive" -d "$target"
            candidate="$(find "$target" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
            if [[ -n "$candidate" ]]; then
              root="$(dirname "$candidate")"
              if [[ -f "$root/gradle.properties" || -f "$root/build.gradle" || -f "$root/build.gradle.kts" ]]; then
                FOUND="$root"
                echo "Proyecto Gradle encontrado en: $FOUND"
                break
              fi
            fi
          done < <(find "$GITHUB_WORKSPACE" -type f -iname '*.zip' -print0)

          if [[ -z "$FOUND" ]]; then
            echo "::error::No encontré un ZIP que contenga settings.gradle y archivos de proyecto Android. Sube el ZIP del proyecto, no el ZIP del panel web."
            find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -printf '%P\n' | head -100 || true
            exit 1
          fi
          echo "ANDROID_PROJECT_DIR=$FOUND" >> "$GITHUB_ENV"

      - name: Aceptar licencias e instalar plataformas necesarias
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          fi
          if [[ ! -x "$SDKMANAGER" ]]; then
            echo "::error::No existe sdkmanager dentro de $SDK_ROOT/cmdline-tools"
            find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -name sdkmanager -type f -print || true
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Aplicar firma estable y subir versiones Android
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path(__import__('os').environ['ANDROID_PROJECT_DIR'])
          version_updates = {
              'gestor-app': (17, 18, "10.0", "10.1"),
              'cobranza-app': (3, 4, "1.2", "1.3"),
              'registro-app': (3, 4, "1.2", "1.3"),
          }
          for module, (old_code, new_code, old_name, new_name) in version_updates.items():
              gradle = root / module / 'build.gradle'
              if not gradle.is_file():
                  raise SystemExit(f"Falta el archivo {gradle}")
              text = gradle.read_text(encoding='utf-8')
              updated, n_code = re.subn(rf'\bversionCode\s+{old_code}\b', f'versionCode {new_code}', text, count=1)
              if n_code != 1:
                  raise SystemExit(f"No se pudo actualizar versionCode en {module}")
              updated, n_name = re.subn(rf"\bversionName\s+['\"]{re.escape(old_name)}['\"]", f"versionName '{new_name}'", updated, count=1)
              if n_name != 1:
                  raise SystemExit(f"No se pudo actualizar versionName en {module}")
              signing = """
          android {
              signingConfigs {
                  stableDebug {
                      storeFile rootProject.file('panel-apk/dentaljg-debug.keystore')
                      storePassword 'dentaljg-debug'
                      keyAlias 'dentaljg-debug'
                      keyPassword 'dentaljg-debug'
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.stableDebug
                  }
              }
          }
          """
              gradle.write_text(updated.rstrip() + "\n\n" + signing.lstrip(), encoding='utf-8')
              print(f"{module}: versionCode {new_code}, versionName {new_name}, firma estable compartida")
          key = root / 'panel-apk' / 'dentaljg-debug.keystore'
          if not key.is_file():
              raise SystemExit(f"Falta la clave de firma estable: {key}")
          PY

      - name: Corregir SQLite, sincronización y caché
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path(__import__('os').environ['ANDROID_PROJECT_DIR'])

          # Corrige una migración que ejecutaba dos veces el mismo ALTER TABLE.
          p = root / 'gestor-app/src/main/java/com/example/gestoriaasistente/CustomerDbHelper.java'
          s = p.read_text(encoding='utf-8')
          alter = '        if (oldVersion < 6) db.execSQL("ALTER TABLE pacientes ADD COLUMN payment_method TEXT NOT NULL DEFAULT \'efectivo\'");'
          double_alter = alter + '\\n' + alter
          if double_alter in s:
              s = s.replace(double_alter, alter, 1)
          if s.count(alter) != 1:
              raise SystemExit('La migración local de payment_method no quedó exactamente una vez.')
          duplicate_put = 'v.put("payment_method", p.optString("payment_method", "efectivo")); v.put("payment_method", p.optString("payment_method", "efectivo"));'
          s = s.replace(duplicate_put, 'v.put("payment_method", p.optString("payment_method", "efectivo"));', 1)
          p.write_text(s, encoding='utf-8')

          # El Gestor solo descarga clientes asignados; no debe intentar altas directas
          # que el esquema reserva para Registro. Los antiguos quedan locales y se notifican.
          p = root / 'gestor-app/src/main/java/com/example/gestoriaasistente/SupabaseSync.java'
          s = p.read_text(encoding='utf-8')
          if 'import java.util.UUID;' not in s:
              s = s.replace('import java.nio.charset.StandardCharsets;', 'import java.nio.charset.StandardCharsets;\\nimport java.text.SimpleDateFormat;\\nimport java.util.Locale;\\nimport java.util.TimeZone;\\nimport java.util.UUID;', 1)
          s = s.replace('    public void sync(CustomerDbHelper db) throws Exception {', '    public String sync(CustomerDbHelper db) throws Exception {', 1)
          start = s.index('        // Leer primero la nube.')
          end = s.index('        // 2) Descargar pacientes del panel y actualizar la copia local sin duplicarlos.', start)
          block = '''        int unlinkedLocalPatients = 0;
          // Solo Registro de clientes da de alta pacientes en Supabase. En Gestor
          // únicamente enlazamos filas locales antiguas cuando la coincidencia no es ambigua.
          JSONArray remotePatients = requestArray("GET", "/rest/v1/patients?select=*&assigned_manager_id=eq." + assignedManager + "&order=created_at.desc", null, jwt, null);
          Cursor unsynced = local.rawQuery("SELECT id,nombre,telefono,remote_id,numero_poliza,clinica FROM pacientes WHERE remote_id IS NULL OR remote_id=''", null);
          try {
              while (unsynced.moveToNext()) {
                  String localName = blank(unsynced.getString(1), "");
                  String localPhone = digits(unsynced.getString(2));
                  String localPolicy = blank(unsynced.getString(4), "");
                  String localClinic = blank(unsynced.getString(5), "");
                  if (localName.isEmpty() || localPhone.isEmpty()) { unlinkedLocalPatients++; continue; }
                  String matchedRemoteId = "";
                  int matches = 0;
                  for (int i = 0; i < remotePatients.length(); i++) {
                      JSONObject candidate = remotePatients.getJSONObject(i);
                      boolean nameMatches = localName.equalsIgnoreCase(blank(candidate.optString("name", ""), ""));
                      boolean phoneMatches = localPhone.equals(digits(candidate.optString("phone", "")));
                      boolean policyMatches = localPolicy.isEmpty() || localPolicy.equalsIgnoreCase(blank(candidate.optString("policy_number", ""), ""));
                      boolean clinicMatches = localClinic.isEmpty() || localClinic.equalsIgnoreCase(blank(candidate.optString("clinic", ""), ""));
                      if (nameMatches && phoneMatches && policyMatches && clinicMatches) {
                          String candidateId = candidate.optString("id", "");
                          if (!candidateId.isEmpty()) { matchedRemoteId = candidateId; matches++; }
                      }
                  }
                  if (matches == 1) db.setRemotePatientId(unsynced.getLong(0), matchedRemoteId);
                  else unlinkedLocalPatients++;
              }
          } finally { unsynced.close(); }

          '''
          if 'Solo Registro de clientes da de alta pacientes' not in s:
              s = s[:start] + block + s[end:]

          # Impide duplicados al repetir un POST de pago tras un corte de conexión:
          # cada pago local tiene un UUID remoto determinista basado en instalación + id SQLite.
          pay_start = s.index('        // 3) Subir abonos locales aún no sincronizados, con el UUID real del paciente.')
          pay_end = s.index('        // 4) Descargar pagos del panel;', pay_start)
          pay_block = '''        // 3) Subir abonos de manera idempotente y conservar su fecha original.
          Cursor localPayments = local.rawQuery("SELECT pa.id,pa.paciente_id,pa.monto,pa.fecha,pa.nota,p.nombre,p.remote_id,pa.remote_id FROM pagos pa JOIN pacientes p ON p.id=pa.paciente_id WHERE pa.remote_id IS NULL OR pa.remote_id=''", null);
          try {
              while (localPayments.moveToNext()) {
                  String patientRemote = localPayments.getString(6);
                  if (patientRemote == null || patientRemote.isEmpty()) continue;
                  long localPaymentId = localPayments.getLong(0);
                  String remotePaymentId = stableRemotePaymentId(localPaymentId);
                  JSONObject pay = new JSONObject();
                  pay.put("id", remotePaymentId);
                  pay.put("patient_id", patientRemote);
                  pay.put("patient_name", localPayments.getString(5));
                  pay.put("amount", localPayments.getDouble(2));
                  pay.put("paid_at", isoUtc(localPayments.getLong(3)));
                  pay.put("concept", blank(localPayments.getString(4), "Abono"));
                  pay.put("reference", blank(localPayments.getString(4), ""));
                  pay.put("source_device", "DENTAL JG APK");
                  JSONArray saved = requestArray("POST", "/rest/v1/payments?on_conflict=id", pay, jwt, "resolution=ignore-duplicates,return=representation");
                  if (saved.length() == 0) {
                      JSONArray existing = requestArray("GET", "/rest/v1/payments?id=eq." + remotePaymentId + "&select=id,patient_id,amount", null, jwt, null);
                      if (existing.length() == 0) throw new Exception("No se pudo confirmar el pago local " + localPaymentId + " en Supabase.");
                      JSONObject prior = existing.getJSONObject(0);
                      if (!patientRemote.equals(prior.optString("patient_id", "")) || Math.abs(prior.optDouble("amount", -1) - localPayments.getDouble(2)) > 0.009) {
                          throw new Exception("El identificador de sincronización del pago " + localPaymentId + " ya existe con datos distintos. Se detuvo para no duplicar ni mezclar pagos.");
                      }
                  }
                  db.setRemotePaymentId(localPaymentId, remotePaymentId);
                  Cursor amountCursor = local.rawQuery("SELECT pagado FROM pacientes WHERE id=?", new String[]{String.valueOf(localPayments.getLong(1))});
                  double localPaid = 0;
                  if (amountCursor.moveToFirst()) localPaid = amountCursor.getDouble(0);
                  amountCursor.close();
                  JSONArray cloudPatient = requestArray("GET", "/rest/v1/patients?id=eq." + patientRemote + "&select=paid", null, jwt, null);
                  double cloudPaid = cloudPatient.length() > 0 ? cloudPatient.getJSONObject(0).optDouble("paid", 0) : 0;
                  if (localPaid > cloudPaid) {
                      JSONObject update = new JSONObject(); update.put("p_patient_id", patientRemote); update.put("p_new_paid", localPaid);
                      request("POST", "/rest/v1/rpc/sync_patient_paid", update, jwt, null);
                  }
              }
          } finally { localPayments.close(); }

          '''
          if 'stableRemotePaymentId(localPaymentId)' not in s:
              s = s[:pay_start] + pay_block + s[pay_end:]

          # Limita la descarga ordinaria de pagos al conjunto de pacientes asignados a este gestor.
          old_download = '''        JSONArray remotePayments=requestArray("GET","/rest/v1/payments?select=*&order=paid_at.desc",null,jwt,null);
          for(int i=0;i<remotePayments.length();i++) db.upsertRemotePayment(remotePayments.getJSONObject(i));
          // Releer la lista de pacientes para incluir los cambios de saldo que guardó el panel.
          remotePatients=requestArray("GET","/rest/v1/patients?select=*&assigned_manager_id=eq." + assignedManager + "&order=created_at.desc",null,jwt,null);
          for(int i=0;i<remotePatients.length();i++) db.upsertRemotePatient(remotePatients.getJSONObject(i));
          }'''
          new_download = '''        StringBuilder assignedPatientIds = new StringBuilder();
          for (int i = 0; i < remotePatients.length(); i++) {
              String id = remotePatients.getJSONObject(i).optString("id", "");
              if (id.matches("[0-9a-fA-F-]{36}")) { if (assignedPatientIds.length() > 0) assignedPatientIds.append(','); assignedPatientIds.append(id); }
          }
          if (assignedPatientIds.length() > 0) {
              JSONArray remotePayments = requestArray("GET", "/rest/v1/payments?select=*&patient_id=in.(" + assignedPatientIds + ")&order=paid_at.desc", null, jwt, null);
              for (int i = 0; i < remotePayments.length(); i++) db.upsertRemotePayment(remotePayments.getJSONObject(i));
          }
          remotePatients = requestArray("GET", "/rest/v1/patients?select=*&assigned_manager_id=eq." + assignedManager + "&order=created_at.desc", null, jwt, null);
          for (int i = 0; i < remotePatients.length(); i++) db.upsertRemotePatient(remotePatients.getJSONObject(i));
          if (unlinkedLocalPatients > 0) {
              return "Sincronización completada. Hay " + unlinkedLocalPatients + " paciente(s) antiguo(s) que siguen solo en este teléfono; no se subieron desde Gestor. Regístralos en Registro de clientes y vuelve a sincronizar para vincularlos sin duplicarlos. Los datos locales se conservaron.";
          }
          return null;
          }
          private String stableRemotePaymentId(long localPaymentId) {
              SharedPreferences identity = context.getSharedPreferences("dentaljg_sync_identity", Context.MODE_PRIVATE);
              String deviceId = identity.getString("sync_device_id", "");
              if (deviceId.isEmpty()) {
                  deviceId = UUID.randomUUID().toString();
                  identity.edit().putString("sync_device_id", deviceId).apply();
              }
              return UUID.nameUUIDFromBytes(("DENTAL-JG-PAYMENT:" + deviceId + ":" + localPaymentId).getBytes(StandardCharsets.UTF_8)).toString();
          }
          private static String isoUtc(long millis) {
              SimpleDateFormat format = new SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss.SSS'Z'", Locale.US);
              format.setTimeZone(TimeZone.getTimeZone("UTC"));
              return format.format(new java.util.Date(millis));
          }'''
          # replace closing final function tail with download block and stable-id helpers
          s_start = s.index('        // 4) Descargar pagos del panel;', s.index('public String sync(CustomerDbHelper db)'))
          s_end = s.index('    private static String blank(', s_start)
          if 'stableRemotePaymentId(long localPaymentId)' not in s:
              s = s[:s_start] + new_download + '\n' + s[s_end:]
          p.write_text(s, encoding='utf-8')

          # Make UI explain when old local-only patients were intentionally kept on device.
          p = root / 'gestor-app/src/main/java/com/example/gestoriaasistente/MainActivity.java'
          s = p.read_text(encoding='utf-8')
          old = '''            String error = null;
              try { cloud.sync(db); }
              catch (Exception ex) { error = ex.getMessage() == null ? "No se pudo sincronizar." : ex.getMessage(); }
              finally { cloudSyncRunning = false; }
              final String result = error;
              runOnUiThread(() -> {
                  refresh();
                  if (notify) {
                      if (result == null) toast(successMessage.isEmpty() ? "Cambios sincronizados." : successMessage);
                      else toast("Guardado en el teléfono; no se pudo sincronizar: " + result);
                  }
              });'''
          new = '''            String error = null;
              String warning = null;
              try { warning = cloud.sync(db); }
              catch (Exception ex) { error = ex.getMessage() == null ? "No se pudo sincronizar." : ex.getMessage(); }
              finally { cloudSyncRunning = false; }
              final String result = error;
              final String syncWarning = warning;
              runOnUiThread(() -> {
                  refresh();
                  if (notify) {
                      if (result != null) toast("No se pudo completar la sincronización: " + result);
                      else if (syncWarning != null && !syncWarning.isEmpty()) toast(syncWarning);
                      else toast(successMessage.isEmpty() ? "Cambios sincronizados." : successMessage);
                  }
              });'''
          if old in s: s = s.replace(old, new, 1)
          old = '''new Thread(()->{String error=null;try{cloud.login(e,p);cloud.verifyManagerKey(k);cloud.sync(db);}catch(Exception ex){error=ex.getMessage()==null?"No se pudo sincronizar.":ex.getMessage();}
                  final String result=error;runOnUiThread(()->{refresh();cloudStatus.setText(cloud.connected()?"Cuenta conectada: "+cloud.email():"Sin cuenta conectada");if(result==null)toast("Sincronización completada.");else toast("No se completó: "+result);});
              }).start();'''
          new = '''new Thread(()->{String error=null,warning=null;try{cloud.login(e,p);cloud.verifyManagerKey(k);warning=cloud.sync(db);}catch(Exception ex){error=ex.getMessage()==null?"No se pudo sincronizar.":ex.getMessage();}
                  final String result=error, syncWarning=warning;runOnUiThread(()->{refresh();cloudStatus.setText(cloud.connected()?"Cuenta conectada: "+cloud.email():"Sin cuenta conectada");if(result!=null)toast("No se completó: "+result);else toast(syncWarning==null?"Sincronización completada.":syncWarning);});
              }).start();'''
          if old in s: s = s.replace(old, new, 1)
          old = '''new Thread(()->{String error=null;try{cloud.sync(db);}catch(Exception ex){error=ex.getMessage()==null?"No se pudo sincronizar.":ex.getMessage();}
                  final String result=error;runOnUiThread(()->{refresh();cloudStatus.setText(cloud.connected()?"Cuenta conectada: "+cloud.email():"Sin cuenta conectada");if(result==null)toast("Sincronización completada.");else toast("No se completó: "+result);});
              }).start();'''
          new = '''new Thread(()->{String error=null,warning=null;try{warning=cloud.sync(db);}catch(Exception ex){error=ex.getMessage()==null?"No se pudo sincronizar.":ex.getMessage();}
                  final String result=error, syncWarning=warning;runOnUiThread(()->{refresh();cloudStatus.setText(cloud.connected()?"Cuenta conectada: "+cloud.email():"Sin cuenta conectada");if(result!=null)toast("No se completó: "+result);else toast(syncWarning==null?"Sincronización completada.":syncWarning);});
              }).start();'''
          if old in s: s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # Bump local service-worker versions so an APK update doesn't continue serving stale cached JS/CSS.
          p = root / 'cobranza-app/src/main/assets/app.js'
          s = p.read_text(encoding='utf-8').replace("serviceWorker.register('./service-worker.js?v=10.8.52'", "serviceWorker.register('./service-worker.js?v=10.8.102'", 1)
          p.write_text(s, encoding='utf-8')
          p = root / 'cobranza-app/src/main/assets/service-worker.js'
          s = p.read_text(encoding='utf-8').replace('dental-jg-10-8-53-recibos-verticales', 'dental-jg-10-8-102-recibos-verticales', 1)
          p.write_text(s, encoding='utf-8')
          p = root / 'panel-apk/src/main/assets/service-worker.js'
          s = p.read_text(encoding='utf-8').replace('admon-app-shell-v10-8-35-cache-clean', 'admon-app-shell-v10-8-102-cache-clean', 1)
          p.write_text(s, encoding='utf-8')
          p = root / 'panel-apk/src/main/assets/index.html'
          s = p.read_text(encoding='utf-8').replace('service-worker.js?v=10.8.101', 'service-worker.js?v=10.8.102')
          p.write_text(s, encoding='utf-8')

          # Stop if any of the critical corrections silently failed to apply.
          if 'No se subieron desde Gestor' not in (root / 'gestor-app/src/main/java/com/example/gestoriaasistente/SupabaseSync.java').read_text():
              raise SystemExit('No quedó el aviso para pacientes locales no vinculados.')
          if 'stableRemotePaymentId(localPaymentId)' not in (root / 'gestor-app/src/main/java/com/example/gestoriaasistente/SupabaseSync.java').read_text():
              raise SystemExit('No quedó activa la sincronización idempotente de pagos.')
          print('Correcciones de SQLite, sincronización de pagos y cachés aplicadas.')
          PY

      - name: Compilar todos los módulos Android
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANDROID_PROJECT_DIR"
          gradle --no-daemon --stacktrace assembleDebug

      - name: Verificar firma, paquetes y versiones de los APK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APKSIGNER="$SDK_ROOT/build-tools/35.0.0/apksigner"
          AAPT="$SDK_ROOT/build-tools/35.0.0/aapt"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          declare -A EXPECTED
          EXPECTED[gestor-app]="com.example.gestoriaasistente 18 10.1"
          EXPECTED[panel-apk]="com.example.dentaljgadmin 6 2.5"
          EXPECTED[cobranza-app]="com.example.dentaljgcobranza 4 1.3"
          EXPECTED[registro-app]="com.example.dentaljgregistro 4 1.3"
          CERT_EXPECTED="c3ea80a5b17f24e7677ea49be5b176b8196b306c35fd8249d8c8fc507338efef"
          for module in gestor-app panel-apk cobranza-app registro-app; do
            apk="$(find "$ANDROID_PROJECT_DIR/$module/build/outputs/apk/debug" -maxdepth 1 -type f -name '*.apk' -print -quit)"
            test -n "$apk"
            meta="$("$AAPT" dump badging "$apk" | sed -n '1p')"
            read -r package version_code version_name <<< "${EXPECTED[$module]}"
            grep -F "name='$package'" <<< "$meta" >/dev/null
            grep -F "versionCode='$version_code'" <<< "$meta" >/dev/null
            grep -F "versionName='$version_name'" <<< "$meta" >/dev/null
            "$APKSIGNER" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/$module-signature.txt"
            cert="$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print tolower($2); exit}' "$RUNNER_TEMP/$module-signature.txt" | tr -d ':')"
            if [[ "$cert" != "$CERT_EXPECTED" ]]; then
              echo "::error::$module no está firmado con la clave estable común. Certificado: $cert"
              cat "$RUNNER_TEMP/$module-signature.txt"
              exit 1
            fi
            echo "OK $module: $meta"
            echo "OK firma estable compartida: $cert"
          done

      - name: Reunir APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/apks"
          while IFS= read -r -d '' apk; do
            rel="${apk#"$ANDROID_PROJECT_DIR"/}"
            module="${rel%%/*}"
            cp -v "$apk" "$GITHUB_WORKSPACE/apks/${module}-$(basename "$apk")"
          done < <(find "$ANDROID_PROJECT_DIR" -type f -path '*/build/outputs/apk/*/*.apk' -print0)
          if [[ -z "$(find "$GITHUB_WORKSPACE/apks" -type f -name '*.apk' -print -quit)" ]]; then
            echo "::error::Gradle terminó pero no se encontró ningún APK generado."
            exit 1
          fi
          ls -lh "$GITHUB_WORKSPACE/apks"

      - name: Guardar APKs como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: DENTAL-JG-APKs-debug
          path: apks/*.apk
          if-no-files-found: error
          retention-days: 14
