          source = source.replace("  async function loadPolicies(){", "  function isJunkPolicyType(value){const clean=String(value||'').normalize('NFKC').trim();if(!clean||/[�\\uFFFD]/.test(clean))return true;const compact=clean.toLocaleLowerCase('es-MX').replace(/[\\s._-]/g,'');return /^(.)\\1{3,}$/.test(compact)||/^o{3,}.*$/i.test(compact); }\\n  async function loadPolicies(){")
          source = source.replace("const vals=[...new Set((data||[]).map(x=>String(x.name||'').trim()).filter(Boolean))];", "const vals=[...new Set((data||[]).map(x=>String(x.name||'').trim()).filter(v=>v && !isJunkPolicyType(v)))];")
          source = source.replace("async function savePolicy(){const name=$('policy').value.trim();if(!name||!db){msg('appMsg','Escribe primero el tipo de póliza.');return;}", "async function savePolicy(){const name=$('policy').value.trim().replace(/\\s+/g,' ');if(!name||!db){msg('appMsg','Escribe primero el tipo de póliza.');return;}if(isJunkPolicyType(name)){msg('appMsg','Ese tipo de póliza parece contener caracteres repetidos o inválidos. Corrígelo antes de guardarlo.');return;}")
          source = source.replace("const holderName=$('holderName').value.trim(), firstNames=$('firstNames').value.trim(), surnames=$('surnames').value.trim(), name=[firstNames,surnames].filter(Boolean).join(' '), clinic=$('clinic').value.trim(), policy=$('policy').value.trim(), policyNumber=$('policyNumber').value.trim(), assignedManagerId=$('assignedManager').value, address=$('address').value.trim(), phone=$('phone').value.trim(), paymentMode=$('paymentMode').value, treatment=$('treatment').value, paymentMethod=$('paymentMethod').value, tabulator=Number($('tabulator').value||0), installmentAmount=Number($('installmentAmount').value||0), installments=parseInt($('installments').value||'0',10), firstPaymentDate=$('firstPaymentDate').value, policyTotal=Number($('policyTotal').value||0);", "const holderName=$('holderName').value.trim(), name=$('patientFullName').value.trim().replace(/\\s+/g,' '), nameParts=name.split(' '), firstNames=nameParts.length>1?nameParts.slice(0,-1).join(' '):name, surnames=nameParts.length>1?nameParts[nameParts.length-1]:'', clinic=$('clinic').value.trim(), policy=$('policy').value.trim().replace(/\\s+/g,' '), policyNumber=$('policyNumber').value.trim(), assignedManagerId=$('assignedManager').value, address=$('address').value.trim(), phone=$('phone').value.trim(), paymentMode=$('paymentMode').value, paymentMethod=$('paymentMethod').value, installmentAmount=Number($('installmentAmount').value||0), installments=parseInt($('installments').value||'0',10), firstPaymentDate=$('firstPaymentDate').value, policyTotal=Number($('policyTotal').value||0);")
          source = source.replace("if(!holderName||!firstNames||!surnames||!clinic||!policy||!policyNumber||!assignedManagerId||!address||!phone||!paymentMode||!treatment||!firstPaymentDate||installments<1||installmentAmount<=0||policyTotal<=0||tabulator<0){msg('appMsg','Completa los campos obligatorios, el importe del tabulador y el número de pagos indicado en Tabulador.');return;}", "if(!holderName||!name||nameParts.length<2||!clinic||!policy||isJunkPolicyType(policy)||!policyNumber||!assignedManagerId||!address||!phone||!paymentMode||!paymentMethod||!firstPaymentDate||installments<1||installmentAmount<=0||policyTotal<=0){msg('appMsg','Completa los campos obligatorios. El nombre del paciente debe incluir nombres y apellidos; revisa también el tipo de póliza y el tabulador.');return;}")
          source = source.replace("if(Math.abs((installmentAmount*installments)-policyTotal)>Math.max(1,policyTotal*0.02)){if(!window.confirm('La cantidad por pago multiplicada por el valor de Tabulador no coincide con el monto total de la póliza. ¿Deseas guardar de todos modos?'))return;}", "if(Math.round(installmentAmount*installments*100)!==Math.round(policyTotal*100)){msg('appMsg','El total no coincide con el importe por pago multiplicado por el tabulador. Revisa los importes.');return;}")
          source = source.replace("p_name:name,p_phone:phone,p_treatment:treatment,p_total:policyTotal,p_installments:installments,p_installment_amount:installmentAmount,p_policy_number:policyNumber,p_policy_type:policy,p_assigned_manager_id:assignedManagerId,p_clinic:clinic,p_first_names:firstNames,p_surnames:surnames,p_address:address,p_phone2:$('phone2').value.trim(),p_observations:$('observations').value.trim(),p_holder_name:holderName,p_payment_mode:paymentMode,p_tabulator:tabulator,p_first_payment_date:firstPaymentDate,p_payment_method:paymentMethod", "p_name:name,p_phone:phone,p_treatment:policy,p_total:policyTotal,p_installments:installments,p_installment_amount:installmentAmount,p_policy_number:policyNumber,p_policy_type:policy,p_assigned_manager_id:assignedManagerId,p_clinic:clinic,p_first_names:firstNames,p_surnames:surnames,p_address:address,p_phone2:$('phone2').value.trim(),p_observations:$('observations').value.trim(),p_holder_name:holderName,p_payment_mode:paymentMode,p_tabulator:0,p_first_payment_date:firstPaymentDate,p_payment_method:paymentMethod")
          if 'patientFullName' not in source or "$('treatment')" in source or "$('tabulator')" in source or 'isJunkPolicyType' not in source:
              raise SystemExit("No se pudo normalizar la lógica de Registro; estructura distinta a la esperada.")
          js.write_text(source, encoding="utf-8")
          print("Formulario Registro actualizado y validado.")
