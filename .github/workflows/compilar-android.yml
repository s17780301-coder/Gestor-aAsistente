              raise SystemExit(f"Falta el logotipo oficial transparente: {official_logo}")
          logo_targets = {
              'Gestor': root / 'gestor-app' / 'src' / 'main' / 'res' / 'drawable-nodpi' / 'dental_jg_logo.png',
              'Registro de clientes': root / 'registro-app' / 'src' / 'main' / 'assets' / 'registro-web' / 'logo-dental-jg.png',
              'Cobranza': root / 'cobranza-app' / 'src' / 'main' / 'assets' / 'logo-dental-jg.png',
          }
          logo_bytes = official_logo.read_bytes()
          for app_name, target in logo_targets.items():
              if not target.parent.is_dir():
                  raise SystemExit(f"No existe la carpeta del logotipo de {app_name}: {target.parent}")
              target.write_bytes(logo_bytes)
              print(f"{app_name}: logotipo oficial transparente aplicado")

          # Los versionCode de los módulos han evolucionado con el proyecto.
          # Aceptar tanto el valor de origen del ZIP 1.0.6 como el ya incrementado
          # hace que el paso sea seguro ante reintentos y no rebaje versiones.
          version_updates = {
              'gestor-app': (19, 20),
              'panel-apk': (9, 10),
              'cobranza-app': (5, 6),
              'registro-app': (5, 6),
          }
          for module, (old_code, new_code) in version_updates.items():
              gradle = root / module / 'build.gradle'
              if not gradle.is_file():
                  raise SystemExit(f"Falta el archivo {gradle}")
              source = gradle.read_text(encoding='utf-8')
              code_match = re.search(r'\bversionCode\s+(\d+)', source)
              if not code_match:
                  raise SystemExit(f"No existe versionCode en {module}")
              current_code = int(code_match.group(1))
              # Nunca fallar solo porque el ZIP ya trae un versionCode más reciente.
              # Solo subirlo hasta el mínimo requerido; jamás rebajarlo.
              target_code = max(current_code, new_code)
              updated = source[:code_match.start(1)] + str(target_code) + source[code_match.end(1):]
              # Toda esta compilación se etiqueta como 1.0.7 sin rebajar versionCode.
              updated, name_count = re.subn(r"(\bversionName\s+['\"])[^'\"]+(['\"])", r"\g<1>1.0.7\2", updated, count=1)
              if name_count != 1:
                  raise SystemExit(f"No existe versionName modificable en {module}")
              # Añadir firma debug común solo si el módulo aún no tiene configuración estable.
              if not re.search(r'\bstableDebug\s*\{', updated):
                  updated = updated.rstrip() + """

          android {
              signingConfigs {
                  stableDebug {
                      storeFile rootProject.file('panel-apk/dentaljg-debug.keystore')
                      storePassword 'dentaljg-debug'
                      keyAlias 'dentaljg-debug'
                      keyPassword 'dentaljg-debug'
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.stableDebug
                  }
              }
          }
          """
              gradle.write_text(updated.rstrip() + "\n", encoding='utf-8')
              print(f"{module}: versionCode {new_code}; versionName conservado")

          key = root / 'panel-apk' / 'dentaljg-debug.keystore'
          if not key.is_file():
              raise SystemExit(f"Falta la clave de firma estable: {key}")
          PY

      - name: Compilar todos los módulos Android
        if: steps.project.outputs.mode == 'source'
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANDROID_PROJECT_DIR"
          gradle --no-daemon --stacktrace assembleDebug

      - name: Verificar firma, paquetes y versiones de los APK
        if: steps.project.outputs.mode == 'source'
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APKSIGNER="$SDK_ROOT/build-tools/35.0.0/apksigner"
          AAPT="$SDK_ROOT/build-tools/35.0.0/aapt"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          declare -A EXPECTED_PACKAGE
          EXPECTED_PACKAGE[gestor-app]="com.example.gestoriaasistente"
          EXPECTED_PACKAGE[panel-apk]="com.example.dentaljgadmin"
          EXPECTED_PACKAGE[cobranza-app]="com.example.dentaljgcobranza"
          EXPECTED_PACKAGE[registro-app]="com.example.dentaljgregistro"
          CERT_EXPECTED="c3ea80a5b17f24e7677ea49be5b176b8196b306c35fd8249d8c8fc507338efef"
          for module in gestor-app panel-apk cobranza-app registro-app; do
            apk="$(find "$ANDROID_PROJECT_DIR/$module/build/outputs/apk/debug" -maxdepth 1 -type f -name '*.apk' -print -quit)"
            test -n "$apk"
            meta="$("$AAPT" dump badging "$apk" | sed -n '1p')"
            gradle_file="$ANDROID_PROJECT_DIR/$module/build.gradle"
            version_code="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]+([0-9]+).*/\1/p' "$gradle_file" | head -1)"
            version_name="$(sed -nE "s/^[[:space:]]*versionName[[:space:]]+['\"]([^'\"]+)['\"].*/\1/p" "$gradle_file" | head -1)"
            package="${EXPECTED_PACKAGE[$module]}"
            test -n "$version_code" && test -n "$version_name"
            grep -F "name='$package'" <<< "$meta" >/dev/null
            grep -F "versionCode='$version_code'" <<< "$meta" >/dev/null
            grep -F "versionName='$version_name'" <<< "$meta" >/dev/null
            "$APKSIGNER" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/$module-signature.txt"
            cert="$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print tolower($2); exit}' "$RUNNER_TEMP/$module-signature.txt" | tr -d ':')"
            if [[ "$cert" != "$CERT_EXPECTED" ]]; then
              echo "::error::$module no está firmado con la clave estable común. Certificado: $cert"
              cat "$RUNNER_TEMP/$module-signature.txt"
              exit 1
            fi
            echo "OK $module: $meta"
            echo "OK firma estable compartida: $cert"
          done

      - name: Reunir APKs con nombres claros y versión verificada
        if: steps.project.outputs.mode == 'source'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/apks"
          declare -A OUTPUT_NAME
          OUTPUT_NAME[gestor-app]="DENTAL_JG_Gestor_1.0.7.apk"
          OUTPUT_NAME[panel-apk]="DENTAL_JG_Administracion_1.0.7.apk"
          OUTPUT_NAME[cobranza-app]="DENTAL_JG_Cobranza_1.0.7.apk"
          OUTPUT_NAME[registro-app]="DENTAL_JG_Registro_Clientes_1.0.7.apk"
          for module in gestor-app panel-apk cobranza-app registro-app; do
            apk="$(find "$ANDROID_PROJECT_DIR/$module/build/outputs/apk/debug" -maxdepth 1 -type f -name '*.apk' -print -quit)"
            [[ -n "$apk" ]] || { echo "::error::No existe APK final para $module."; exit 1; }
            cp -v "$apk" "$GITHUB_WORKSPACE/apks/${OUTPUT_NAME[$module]}"
          done
          count="$(find "$GITHUB_WORKSPACE/apks" -maxdepth 1 -type f -name '*.apk' | wc -l)"
          [[ "$count" == "4" ]] || { echo "::error::Se esperaban 4 APKs y se reunieron $count."; exit 1; }
          ls -lh "$GITHUB_WORKSPACE/apks"

      - name: Guardar APKs como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: DENTAL-JG-APKs-1.0.7-verified
          path: apks/*.apk
          if-no-files-found: error
          retention-days: 14

