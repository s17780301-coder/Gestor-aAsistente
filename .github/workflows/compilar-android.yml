name: Compilar APKs DENTAL JG desde ZIP

on:
  push:
    branches: [main]
    paths:
      - '*.zip'
      - '**/*.zip'
      - '.github/workflows/compilar-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK preinstalado
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          fi
          "$SDKMANAGER" --version

      - name: Instalar Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gradle-8.9/bin/gradle" --version

      - name: Encontrar proyecto fuente o APKs ya compilados
        id: project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dental_extract" "$GITHUB_WORKSPACE/apks"
          FOUND=""
          # Prioriza el ZIP de corrección más reciente y no recompila una versión antigua
          # si el archivo objetivo contiene el proyecto Gradle.
          while IFS= read -r -d '' archive; do
            if ! unzip -tq "$archive" >/dev/null 2>&1; then
              echo "::warning::Se omite ZIP dañado: $archive"
              continue
            fi
            target="$RUNNER_TEMP/dental_extract/$(basename "$archive" .zip)"
            mkdir -p "$target"
            unzip -oq "$archive" -d "$target"
            candidate="$(find "$target" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
            if [[ -n "$candidate" ]]; then
              root="$(dirname "$candidate")"
              if [[ -f "$root/gradle.properties" || -f "$root/build.gradle" || -f "$root/build.gradle.kts" ]]; then
                FOUND="$root"
                echo "Proyecto Gradle encontrado en ZIP: $(basename "$archive")"
                echo "Proyecto Gradle en: $FOUND"
                break
              fi
            fi
          done < <(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname '*.zip' -print0 | sort -z -r)

          if [[ -z "$FOUND" ]]; then
            while IFS= read -r -d '' apk; do
              cp -n "$apk" "$GITHUB_WORKSPACE/apks/$(basename "$apk")"
            done < <(find "$RUNNER_TEMP/dental_extract" -type f -iname '*.apk' -print0)
            if [[ -n "$(find "$GITHUB_WORKSPACE/apks" -type f -iname '*.apk' -print -quit)" ]]; then
              echo "::notice::El ZIP contiene APKs ya compilados; no se recompilaron."
              echo "mode=apks" >> "$GITHUB_OUTPUT"
              ls -lh "$GITHUB_WORKSPACE/apks"
              exit 0
            fi
            echo "::error::No se encontró proyecto Gradle ni APK dentro de los ZIP del repositorio."
            find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -printf '%P\n' | head -100 || true
            exit 1
          fi
          echo "ANDROID_PROJECT_DIR=$FOUND" >> "$GITHUB_ENV"
          echo "mode=source" >> "$GITHUB_OUTPUT"

      - name: Localizar el botón de roles y sus estilos
        if: steps.project.outputs.mode == 'source'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          root = Path(os.environ["ANDROID_PROJECT_DIR"])
          exts = {".html", ".htm", ".css", ".js", ".xml", ".kt", ".java"}
          terms = ("registro de roles", "pacientes", "cobranza", "clínica", "clinica")
          hits = 0
          for p in root.rglob("*"):
              if not p.is_file() or p.suffix.lower() not in exts or any(x in p.parts for x in ("build", ".gradle", "node_modules")):
                  continue
              try: lines = p.read_text(encoding="utf-8").splitlines()
              except (UnicodeDecodeError, OSError): continue
              matched = [i for i, line in enumerate(lines) if any(t in line.lower() for t in terms)]
              if not matched: continue
              print(f"--- SOURCE {p.relative_to(root)} ---")
              shown = set()
              for i in matched:
                  for j in range(max(0, i-2), min(len(lines), i+3)):
                      if j not in shown:
                          print(f"{j+1}: {lines[j][:300]}")
                          shown.add(j)
                  hits += 1
                  if hits >= 60:
                      print("Diagnostic output capped.")
                      raise SystemExit(0)
          print(f"Diagnostic matches: {hits}")
          PY

      - name: Aceptar licencias e instalar plataformas necesarias
        if: steps.project.outputs.mode == 'source'
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          fi
          if [[ ! -x "$SDKMANAGER" ]]; then
            echo "::error::No existe sdkmanager dentro de $SDK_ROOT/cmdline-tools"
            find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -name sdkmanager -type f -print || true
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Aplicar firma estable y subir versiones Android
        if: steps.project.outputs.mode == 'source'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os, re

          root = Path(os.environ['ANDROID_PROJECT_DIR'])
          official_logo = root / 'panel-apk' / 'src' / 'main' / 'assets' / 'logo-dental-jg.png'
          if not official_logo.is_file():
              raise SystemExit(f"Falta el logotipo oficial transparente: {official_logo}")
          logo_targets = {
              'Gestor': root / 'gestor-app' / 'src' / 'main' / 'res' / 'drawable-nodpi' / 'dental_jg_logo.png',
              'Registro de clientes': root / 'registro-app' / 'src' / 'main' / 'assets' / 'registro-web' / 'logo-dental-jg.png',
              'Cobranza': root / 'cobranza-app' / 'src' / 'main' / 'assets' / 'logo-dental-jg.png',
          }
          logo_bytes = official_logo.read_bytes()

       python3 - <<'PY'
          from pathlib import Path
          import os, re

          root = Path(os.environ['ANDROID_PROJECT_DIR'])
          official_logo = root / 'panel-apk' / 'src' / 'main' / 'assets' / 'logo-dental-jg.png'
          if not official_logo.is_file():
              raise SystemExit(f"Falta el logotipo oficial transparente: {official_logo}")
          logo_targets = {
              'Gestor': root / 'gestor-app' / 'src' / 'main' / 'res' / 'drawable-nodpi' / 'dental_jg_logo.png',
              'Registro de clientes': root / 'registro-app' / 'src' / 'main' / 'assets' / 'registro-web' / 'logo-dental-jg.png',
              'Cobranza': root / 'cobranza-app' / 'src' / 'main' / 'assets' / 'logo-dental-jg.png',
          }
          logo_bytes = official_logo.read_bytes()

          # Conservar intactos los iconos de las aplicaciones del ZIP.
          for app_name, target in logo_targets.items():
              if not target.parent.is_dir():
                  raise SystemExit(f"No existe la carpeta del logotipo de {app_name}: {target.parent}")
              target.write_bytes(logo_bytes)
              print(f"{app_name}: logotipo oficial transparente aplicado ({len(logo_bytes)} bytes)")

          # Corrige también el texto visible que estaba fijado como 1.0.2 en la interfaz.
          # Limita el cambio a archivos de texto fuente; no toca imágenes ni binarios.
          text_ext = {'.xml', '.html', '.htm', '.js', '.ts', '.css', '.json', '.properties', '.kt', '.java', '.txt', '.md'}
          changed_labels = 0
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in text_ext:
                  continue
              if any(part in {'build', '.gradle', 'node_modules'} for part in path.parts):
                  continue
              try:
                  body = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              if '1.0.2' in body:
                  path.write_text(body.replace('1.0.2', '1.0.3'), encoding='utf-8')
                  changed_labels += 1
                  print(f"Versión visible 1.0.2 -> 1.0.3: {path.relative_to(root)}")
          print(f"Archivos de interfaz con versión corregida: {changed_labels}")

          version_updates = {'gestor-app': (17, 18), 'cobranza-app': (3, 4), 'registro-app': (3, 4), 'panel-apk': (7, 8)}
          for module, (old_code, new_code) in version_updates.items():
              gradle = root / module / 'build.gradle'
              if not gradle.is_file():
                  raise SystemExit(f"Falta el archivo {gradle}")
              source = gradle.read_text(encoding='utf-8')
              code_match = re.search(r'\bversionCode\s+(\d+)', source)
              if not code_match:
                  raise SystemExit(f"No existe versionCode en {module}")
              current_code = int(code_match.group(1))
              if current_code == old_code:
                  updated = source[:code_match.start(1)] + str(new_code) + source[code_match.end(1):]
              elif current_code == new_code:
                  updated = source
              else:
                  raise SystemExit(f"versionCode inesperado en {module}: {current_code}; se esperaba {old_code} o {new_code}")
              updated, count = re.subn(r"\bversionName\s+['\"][^'\"]+['\"]", "versionName '1.0.3'", updated, count=1)
              if count != 1:
                  raise SystemExit(f"No se pudo actualizar versionName en {module}")
              # Detecta correctamente el bloque existente; evita duplicar signingConfigs.
              if not re.search(r'\bstableDebug\s*\{', updated):
                  updated = updated.rstrip() + """

          android {
              signingConfigs {
                  stableDebug {
                      storeFile rootProject.file('panel-apk/dentaljg-debug.keystore')
                      storePassword 'dentaljg-debug'
                      keyAlias 'dentaljg-debug'
                      keyPassword 'dentaljg-debug'
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.stableDebug
                  }
              }
          }
          """
              gradle.write_text(updated.rstrip() + "\n", encoding='utf-8')
              print(f"{module}: versionCode {new_code}, versionName 1.0.3")
          key = root / 'panel-apk' / 'dentaljg-debug.keystore'
          if not key.is_file():
              raise SystemExit(f"Falta la clave de firma estable: {key}")
          PY

      - name: Compilar todos los módulos Android
        if: steps.project.outputs.mode == 'source'
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANDROID_PROJECT_DIR"
          gradle --no-daemon --stacktrace assembleDebug

      - name: Verificar firma, paquetes y versiones de los APK
        if: steps.project.outputs.mode == 'source'
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APKSIGNER="$SDK_ROOT/build-tools/35.0.0/apksigner"
          AAPT="$SDK_ROOT/build-tools/35.0.0/aapt"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          declare -A EXPECTED
          EXPECTED[gestor-app]="com.example.gestoriaasistente 18 1.0.3"
          EXPECTED[panel-apk]="com.example.dentaljgadmin 8 1.0.3"
          EXPECTED[cobranza-app]="com.example.dentaljgcobranza 4 1.0.3"
          EXPECTED[registro-app]="com.example.dentaljgregistro 4 1.0.3"
          CERT_EXPECTED="c3ea80a5b17f24e7677ea49be5b176b8196b306c35fd8249d8c8fc507338efef"
          for module in gestor-app panel-apk cobranza-app registro-app; do
            apk="$(find "$ANDROID_PROJECT_DIR/$module/build/outputs/apk/debug" -maxdepth 1 -type f -name '*.apk' -print -quit)"
            test -n "$apk"
            meta="$("$AAPT" dump badging "$apk" | sed -n '1p')"
            read -r package version_code version_name <<< "${EXPECTED[$module]}"
            grep -F "name='$package'" <<< "$meta" >/dev/null
            grep -F "versionCode='$version_code'" <<< "$meta" >/dev/null
            grep -F "versionName='$version_name'" <<< "$meta" >/dev/null
            "$APKSIGNER" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/$module-signature.txt"
            cert="$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print tolower($2); exit}' "$RUNNER_TEMP/$module-signature.txt" | tr -d ':')"
            if [[ "$cert" != "$CERT_EXPECTED" ]]; then
              echo "::error::$module no está firmado con la clave estable común. Certificado: $cert"
              cat "$RUNNER_TEMP/$module-signature.txt"
              exit 1
            fi
            echo "OK $module: $meta"
            echo "OK firma estable compartida: $cert"
          done

      - name: Reunir APKs
        if: steps.project.outputs.mode == 'source'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/apks"
          while IFS= read -r -d '' apk; do
            rel="${apk#"$ANDROID_PROJECT_DIR"/}"
            module="${rel%%/*}"
            cp -v "$apk" "$GITHUB_WORKSPACE/apks/${module}-$(basename "$apk")"
          done < <(find "$ANDROID_PROJECT_DIR" -type f -path '*/build/outputs/apk/*/*.apk' -print0)
          if [[ -z "$(find "$GITHUB_WORKSPACE/apks" -type f -name '*.apk' -print -quit)" ]]; then
            echo "::error::Gradle terminó pero no se encontró ningún APK generado."
            exit 1
          fi
          ls -lh "$GITHUB_WORKSPACE/apks"

      - name: Guardar APKs como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: DENTAL-JG-APKs-debug
          path: apks/*.apk
          if-no-files-found: error
          retention-days: 14
