name: Compilar APKs DENTAL JG desde ZIP

on:
  push:
    branches: [main]
    paths:
      - '*.zip'
      - '**/*.zip'
      - '.github/workflows/compilar-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK preinstalado
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          fi
          "$SDKMANAGER" --version

      - name: Instalar Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gradle-8.9/bin/gradle" --version

      - name: Encontrar proyecto fuente o APKs ya compilados
        id: project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dental_extract" "$GITHUB_WORKSPACE/apks"
          FOUND=""
          # Prioriza el ZIP de corrección más reciente y no recompila una versión antigua
          # si el archivo objetivo contiene el proyecto Gradle.
          while IFS= read -r -d '' archive; do
            if ! unzip -tq "$archive" >/dev/null 2>&1; then
              echo "::warning::Se omite ZIP dañado: $archive"
              continue
            fi
            target="$RUNNER_TEMP/dental_extract/$(basename "$archive" .zip)"
            mkdir -p "$target"
            unzip -oq "$archive" -d "$target"
            candidate="$(find "$target" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
            if [[ -n "$candidate" ]]; then
              root="$(dirname "$candidate")"
              if [[ -f "$root/gradle.properties" || -f "$root/build.gradle" || -f "$root/build.gradle.kts" ]]; then
                FOUND="$root"
                echo "Proyecto Gradle encontrado en ZIP: $(basename "$archive")"
                echo "Proyecto Gradle en: $FOUND"
                break
              fi
            fi
          done < <(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname '*.zip' -print0 | sort -z -r)

          if [[ -z "$FOUND" ]]; then
            while IFS= read -r -d '' apk; do
              cp -n "$apk" "$GITHUB_WORKSPACE/apks/$(basename "$apk")"
            done < <(find "$RUNNER_TEMP/dental_extract" -type f -iname '*.apk' -print0)
            if [[ -n "$(find "$GITHUB_WORKSPACE/apks" -type f -iname '*.apk' -print -quit)" ]]; then
              echo "::notice::El ZIP contiene APKs ya compilados; no se recompilaron."
              echo "mode=apks" >> "$GITHUB_OUTPUT"
              ls -lh "$GITHUB_WORKSPACE/apks"
              exit 0
            fi
            echo "::error::No se encontró proyecto Gradle ni APK dentro de los ZIP del repositorio."
            find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -printf '%P\n' | head -100 || true
            exit 1
          fi
          echo "ANDROID_PROJECT_DIR=$FOUND" >> "$GITHUB_ENV"
          echo "mode=source" >> "$GITHUB_OUTPUT"

      - name: Unificar el estilo del botón Registro de roles en Admon
        if: steps.project.outputs.mode == 'source'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          root = Path(os.environ["ANDROID_PROJECT_DIR"])
          html = root / "panel-apk" / "src" / "main" / "assets" / "index.html"
          css = root / "panel-apk" / "src" / "main" / "assets" / "styles.css"
          page = html.read_text(encoding="utf-8")
          page = page.replace('class="nav nav-role-entry"', 'class="nav"')
          html.write_text(page, encoding="utf-8")
          styles = css.read_text(encoding="utf-8")
          styles = styles.replace('.nav[data-page="users"]{grid-column:1/-1!important;justify-content:center!important}', '')
          mobile = '/* Alineación uniforme de Registro de roles */\n@media(max-width:700px){.sidebar nav button.nav[data-page="users"]{grid-column:auto!important;justify-content:flex-start!important}}\n'
          if mobile.strip() not in styles:
              styles = styles.rstrip() + "\n\n" + mobile
              css.write_text(styles, encoding="utf-8")
          print("Botón Registro de roles normalizado sin alterar su acción.")
          PY

      - name: Reparar validación de roles y sesión con la fuente 1.0.7
        if: steps.project.outputs.mode == 'source'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os, re

          root = Path(os.environ["ANDROID_PROJECT_DIR"])

          # Cobranza: no abrir el panel hasta que se valide el rol permitido.
          p = root / "cobranza-app/src/main/assets/app.js"
          s = p.read_text(encoding="utf-8")
          login_start = "async function login(email,password){"
          logout_start = "async function logout(){"
          i, j = s.find(login_start), s.find(logout_start)
          if i < 0 or j <= i:
              raise SystemExit("No se encontró el bloque de acceso de Cobranza; se cancela la compilación.")
          replacement = """async function login(email,password){$('loginMsg').textContent='Validando…';if(!cfg.supabaseUrl||!cfg.supabaseAnonKey){$('loginMsg').textContent='Falta configurar config.js de Cobranza';return}if(!db)db=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,storage:window.localStorage}});let result;try{result=await db.auth.signInWithPassword({email,password})}catch(e){$('loginMsg').textContent='No se pudo contactar Supabase. Revisa internet e inténtalo otra vez.';return}let {data,error}=result;if(error){$('loginMsg').textContent='No se pudo iniciar sesión: '+(error.message||'revisa correo y contraseña');return}user=data.user;await start()}async function readRoles(uid){let r=await db.from('app_user_roles').select('role').eq('user_id',uid);if(r.error&&/user_id|column|schema cache|does not exist/i.test(r.error.message||''))r=await db.from('app_user_roles').select('role').eq('id_usuario',uid);if(r.error)throw r.error;return (r.data||[]).map(x=>String(x.role||'').trim().toLowerCase())}async function start(){if(!user)return;$('loginView').classList.remove('hidden');$('appView').classList.add('hidden');$('loginMsg').textContent='Verificando permisos…';try{const userRoles=await readRoles(user.id);currentRole=['admin','cobranza','registro','gestor'].find(role=>userRoles.includes(role))||'';if(!['admin','cobranza'].includes(currentRole)){await db.auth.signOut();user=null;currentRole='';isAdmin=false;canManageClients=false;$('loginView').classList.remove('hidden');$('appView').classList.add('hidden');$('loginMsg').textContent='Acceso denegado: esta aplicación requiere el rol Cobranza o Administración. Pide que te asignen el permiso correcto.';return}isAdmin=userRoles.includes('admin');canManageClients=['admin','cobranza'].some(role=>userRoles.includes(role));$('loginView').classList.add('hidden');$('appView').classList.remove('hidden');connection(false,'Conectando con Supabase…');try{await loadSettings()}catch(e){console.error(e);toast('Sesión válida; falta revisar la configuración de recibos.')}await load(true);await loadPortfolioData();await loadClinics();realtime();page('home')}catch(e){console.error('No se pudieron verificar los permisos de Cobranza',e);await db.auth.signOut();user=null;currentRole='';isAdmin=false;canManageClients=false;$('loginView').classList.remove('hidden');$('appView').classList.add('hidden');$('loginMsg').textContent='No se pudieron verificar tus permisos en Supabase: '+(e.message||'error de consulta')+'. Comprueba la columna user_id/id_usuario y los permisos de lectura de app_user_roles.'}}"""
          s = s[:i] + replacement + s[j:]
          if "async function readRoles(uid)" not in s or ".eq('id_usuario',uid)" not in s or "requiere el rol Cobranza o Administración" not in s:
              raise SystemExit("Falló la verificación del parche de acceso de Cobranza.")
          p.write_text(s, encoding="utf-8")

          # Registro: consulta user_id y cae a id_usuario solo si el esquema lo requiere.
          p = root / "registro-app/src/main/assets/registro-web/app.js"
          s = p.read_text(encoding="utf-8")
          new_block = """// La tabla puede usar user_id o id_usuario según la instalación.
              let roleResult = await db.from('app_user_roles')
                .select('role')
                .eq('user_id', candidateUser.id)
                .in('role', ['registro', 'admin']);
              if (roleResult.error && /user_id|column|schema cache|does not exist/i.test(roleResult.error.message || '')) {
                roleResult = await db.from('app_user_roles')
                  .select('role')
                  .eq('id_usuario', candidateUser.id)
                  .in('role', ['registro', 'admin']);
              }
              const { data, error } = roleResult;"""
          pattern = re.compile(r"""const\s*\{\s*data\s*,\s*error\s*\}\s*=\s*await\s+db\.from\(['"]app_user_roles['"]\)\s*\.select\(['"]role['"]\)\s*\.eq\(['"]user_id['"]\s*,\s*candidateUser\.id\)\s*\.in\(['"]role['"]\s*,\s*\[['"]registro['"]\s*,\s*['"]admin['"]\]\);""")
          s, count = pattern.subn(new_block, s, count=1)
          if not count and "id_usuario" not in s:
              raise SystemExit("No se pudo aplicar la compatibilidad de roles de Registro.")
          p.write_text(s, encoding="utf-8")

          # Admon: restaurar sesiones solo después de verificar rol admin.
          p = root / "panel-apk/src/main/assets/app.js"
          s = p.read_text(encoding="utf-8")
          old_init = """if(configured){try{client=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storage:window.localStorage}});client.auth.getSession().then(({data,error})=>{if(!error&&data&&data.session){showApp();load(true);realtime();}}).catch(err=>console.warn('No se pudo restaurar la sesión',err));client.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_IN'&&session&&$('appView').classList.contains('hidden')){showApp();load(true);realtime();}});}catch(err){console.error('No se pudo inicializar la sesión',err);}}"""
          new_init = """if(configured){try{client=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storage:window.localStorage}});client.auth.getSession().then(({data,error})=>{if(!error&&data&&data.session)restoreAdminSession(data.session);}).catch(err=>console.warn('No se pudo restaurar la sesión',err));client.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_IN'&&session&&$('appView').classList.contains('hidden'))restoreAdminSession(session);if(event==='SIGNED_OUT'){$('appView').classList.add('hidden');$('loginView').classList.remove('hidden');}});}catch(err){console.error('No se pudo inicializar la sesión',err);}}"""
          helper = """async function restoreAdminSession(session){if(!session||!client)return;try{const {data,error}=await client.functions.invoke('administrar-usuarios',{body:{action:'my_roles'}});if(error)throw error;const roles=(data?.roles||[]).map(r=>String(r).toLowerCase());if(!roles.includes('admin')){await client.auth.signOut();msg('Acceso denegado: esta cuenta no tiene rol de Administración.');return;}const {data:userData}=await client.auth.getUser();$('ownCurrentEmail').value=userData?.user?.email||'';showApp();await load(true);await loadAdminUsers();realtime();}catch(err){console.error('No se pudo verificar el rol al restaurar la sesión',err);await client.auth.signOut();msg('No se pudo verificar el permiso de Administración. Inicia sesión de nuevo o revisa la función administrar-usuarios.');}}"""
          if old_init in s:
              new_init = """if(configured){try{client=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storage:window.localStorage}});client.auth.getSession().then(({data,error})=>{if(!error&&data&&data.session)restoreAdminSession(data.session);}).catch(err=>console.warn('No se pudo restaurar la sesión',err));client.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_IN'&&session&&$('appView').classList.contains('hidden'))restoreAdminSession(session);if(event==='SIGNED_OUT'){$('appView').classList.add('hidden');$('loginView').classList.remove('hidden');}});}catch(err){console.error('No se pudo inicializar la sesión',err);}}"""
              s = s.replace(old_init, helper + new_init, 1)
          elif "async function restoreAdminSession(session)" not in s:
              raise SystemExit("No se encontró la inicialización de sesión de Admon; se cancela la compilación.")
          p.write_text(s, encoding="utf-8")

          # Función Supabase my_roles: mantener comportamiento y soportar ambos nombres de columna.
          p = root / "supabase/functions/administrar-usuarios/index.ts"
          if not p.is_file():
              raise SystemExit("Falta supabase/functions/administrar-usuarios/index.ts.")
          s = p.read_text(encoding="utf-8")
          pattern = re.compile(r'''if \(action === "my_roles"\) \{\s*const \{ data: roleRows, error: myRolesError \} = await adminClient\s*\.from\("app_user_roles"\)\s*\.select\("role"\)\s*\.eq\("user_id", callerData\.user\.id\);''')
          new_role_query = '''if (action === "my_roles") {
            let roleResult = await adminClient
              .from("app_user_roles")
              .select("role")
              .eq("user_id", callerData.user.id);
            if (roleResult.error && /user_id|column|schema cache|does not exist/i.test(roleResult.error.message || "")) {
              roleResult = await adminClient
                .from("app_user_roles")
                .select("role")
                .eq("id_usuario", callerData.user.id);
            }
            const { data: roleRows, error: myRolesError } = roleResult;'''
          s, count = pattern.subn(new_role_query, s, count=1)
          if count == 0 and "const { data: roleRows, error: myRolesError } = await adminClient" in s:
              raise SystemExit("No se pudo adaptar la consulta my_roles de Supabase.")
          p.write_text(s, encoding="utf-8")
          print("Compatibilidad de roles preparada en Supabase.")
          
          # Invalidar caché web y reflejar la versión de las APK nuevas.
          for rel in ["panel-apk/src/main/assets/index.html",
                      "registro-app/src/main/assets/registro-web/index.html",
                      "cobranza-app/src/main/assets/index.html"]:
              p = root / rel
              s = p.read_text(encoding="utf-8")
              if rel.startswith("panel-apk"):
                  s = s.replace("1.0.6.6", "1.0.7.7").replace("1.0.6.7", "1.0.7.7")
              else:
                  s = s.replace("?v=1.0.6", "?v=1.0.7")
              s = s.replace("Versión 1.0.6", "Versión 1.0.7")
              p.write_text(s, encoding="utf-8")

          print("Correcciones de acceso 1.0.7 verificadas en Cobranza, Registro y Admon.")
          PY

      - name: Corregir edición y guardado del correo de la cuenta Admon
        if: steps.project.outputs.mode == 'source'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os

          root = Path(os.environ["ANDROID_PROJECT_DIR"])
          html = root / "panel-apk" / "src" / "main" / "assets" / "index.html"
          js = root / "panel-apk" / "src" / "main" / "assets" / "app.js"
          if not html.is_file() or not js.is_file():
              raise SystemExit("Faltan index.html o app.js del panel Admon.")

          page = html.read_text(encoding="utf-8")
          old_fields = '<label>Correo actual</label><input id="ownCurrentEmail" type="email" readonly><label>Nuevo correo (opcional)</label><input id="ownNewEmail" type="email" maxlength="254" placeholder="Nuevo correo">'
          new_fields = '<label>Correo de la cuenta (editable)</label><input id="ownCurrentEmail" type="email" maxlength="254" autocomplete="email" required>'
          if old_fields in page:
              page = page.replace(old_fields, new_fields, 1)
              html.write_text(page, encoding="utf-8")
              print("Campo de correo desbloqueado y simplificado.")
          elif new_fields not in page:
              raise SystemExit("El formulario de correo tiene una estructura inesperada; no se publicará un cambio parcial.")

          source = js.read_text(encoding="utf-8")
          start = source.find("$('ownAccountForm').addEventListener('submit'")
          end = source.find("$('loginForm').addEventListener('submit'", start)
          if start < 0 or end < 0:
              raise SystemExit("No se encontró el manejador del formulario de cuenta; se cancela la compilación.")
          handler = """$('ownAccountForm').addEventListener('submit',async e=>{
            e.preventDefault();
            const form=e.currentTarget,button=form.querySelector('button[type=submit]');
            const email=$('ownCurrentEmail').value.trim().toLowerCase();
            const password=$('ownNewPassword').value;
            const confirmPassword=$('ownConfirmPassword').value;
            if(!email){$('ownAccountMessage').textContent='Escribe un correo válido.';return;}
            if(password&&password.length<8){$('ownAccountMessage').textContent='La contraseña debe tener al menos 8 caracteres.';return;}
            if(password&&password!==confirmPassword){$('ownAccountMessage').textContent='Las contraseñas no coinciden.';return;}
            if(!password&&confirmPassword){$('ownAccountMessage').textContent='Para confirmar una contraseña, primero escribe la nueva contraseña.';return;}
            if(!confirm('¿Confirmas guardar los cambios de tu cuenta?'))return;
            const originalText=button?.textContent||'Guardar cambios de mi cuenta';
            if(button){button.disabled=true;button.textContent='Guardando…';}
            $('ownAccountMessage').textContent='Guardando cambios de tu cuenta…';
            try{
              const {data:current,error:currentError}=await client.auth.getUser();
              if(currentError)throw currentError;
              const currentEmail=String(current?.user?.email||'').trim().toLowerCase();
              if(!currentEmail)throw new Error('No se pudo identificar la cuenta autenticada. Cierra sesión y vuelve a entrar.');
              const changes={},emailChanged=email!==currentEmail;
              if(emailChanged)changes.email=email;
              if(password)changes.password=password;
              if(!Object.keys(changes).length){$('ownAccountMessage').textContent='No hay cambios que guardar.';return;}
              const {data,error}=await client.auth.updateUser(changes);
              if(error)throw error;
              if(password){$('ownNewPassword').value='';$('ownConfirmPassword').value='';}
              if(emailChanged){
                const savedEmail=String(data?.user?.email||'').trim().toLowerCase();
                if(savedEmail===email){
                  $('ownCurrentEmail').value=savedEmail;
                  $('ownAccountMessage').textContent='Correo actualizado correctamente.'+(password?' La contraseña también se actualizó.':'');
                }else{
                  $('ownAccountMessage').textContent='Supabase recibió la solicitud para cambiar el correo a '+email+'. Si la confirmación de correo está activada, el cambio se hará efectivo después de abrir el mensaje de verificación enviado a esa dirección.'+(password?' La contraseña sí se actualizó.':'');
                }
              }else{
                $('ownCurrentEmail').value=data?.user?.email||currentEmail;
                $('ownAccountMessage').textContent='Contraseña actualizada y guardada correctamente.';
              }
            }catch(err){
              $('ownAccountMessage').textContent='No se pudieron guardar los cambios: '+(err.message||'Error desconocido.');
            }finally{
              if(button){button.disabled=false;button.textContent=originalText;}
            }
          });
          """
          source = source[:start] + handler + source[end:]
          source = source.replace("$('ownCurrentEmail').value=data?.user?.email||$('ownCurrentEmail').value;", "$('ownCurrentEmail').value=userData?.user?.email||$('ownCurrentEmail').value;")
          js.write_text(source, encoding="utf-8")
          print("Formulario de cuenta actualizado: correo editable, validación y mensajes reales de guardado.")
          PY

      - name: Mostrar el error real de inicio de sesión en Admon
        if: steps.project.outputs.mode == 'source'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          root = Path(os.environ["ANDROID_PROJECT_DIR"])
          app = root / "panel-apk" / "src" / "main" / "assets" / "app.js"
          if not app.is_file():
              raise SystemExit("No se encontró app.js de Admon.")
          source = app.read_text(encoding="utf-8")
          old = "if(error){msg('No se pudo iniciar sesión. Verifica correo y contraseña.');return;}"
          new = "if(error){msg('No se pudo iniciar sesión: '+(error.message||'Supabase rechazó las credenciales')+(error.status?' (HTTP '+error.status+')':''));return;}"
          if old in source:
              source = source.replace(old, new, 1)
          elif new not in source:
              raise SystemExit("No se encontró el mensaje esperado de autenticación; no se aplicó un cambio parcial.")
          needle = "const {error}=await client.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});"
          replacement = "let authResult;try{authResult=await client.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});}catch(authError){msg('No se pudo contactar Supabase: '+(authError.message||'revisa la conexión a internet.'));return;}const {error}=authResult;"
          if needle in source:
              source = source.replace(needle, replacement, 1)
          elif replacement not in source:
              raise SystemExit("No se encontró la llamada esperada al inicio de sesión.")
          app.write_text(source, encoding="utf-8")
          print("Admon mostrará el motivo real del rechazo de acceso o un error de conexión.")
          PY

      - name: Corregir coherencia del formulario Registro de clientes 1.0.8
        if: steps.project.outputs.mode == 'source'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          root = Path(os.environ["ANDROID_PROJECT_DIR"])
          html = root / "registro-app/src/main/assets/registro-web/index.html"
          js = root / "registro-app/src/main/assets/registro-web/app.js"
          page = html.read_text(encoding="utf-8")
          page = page.replace('<label>Folio *<input id="folio" readonly placeholder="Lo asigna el sistema"></label>', '<label>Folio (automático)<input id="folio" readonly placeholder="Se asignará al guardar"></label>')
          page = page.replace('<label>Nombre(s) del paciente *<input id="firstNames" maxlength="160" required placeholder="Nombre(s) de la persona atendida"></label><label>Apellidos del paciente *<input id="surnames" maxlength="160" required placeholder="Apellidos de la persona atendida"></label>', '<label>Nombre completo del paciente (nombres y apellidos) *<input id="patientFullName" maxlength="160" required placeholder="Escribe nombres y apellidos completos"></label>')
          page = page.replace('<label>Tratamiento *<select id="treatment" required><option value="">Selecciona tratamiento</option><option value="Básico">Básico</option><option value="Orto">Orto</option><option value="VIP">VIP</option><option value="Damon">Damon</option></select></label>', '')
          page = page.replace('<label>Importe del tabulador ($) *<input id="tabulator" type="number" min="0" step="0.01" value="0" required></label>', '')
          page = page.replace('Tabulador (número de quincenas) *', 'Tabulador (número de pagos) *').replace('Tabulador (número de mensualidades) *', 'Tabulador (número de pagos mensuales) *')
