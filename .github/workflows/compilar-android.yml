      - name: Retirar botón de regreso al panel de los módulos Android
        if: steps.project.outputs.mode == 'source'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          root = Path(os.environ["ANDROID_PROJECT_DIR"])
          pages = [
              root / "registro-app/src/main/assets/registro-web/index.html",
              root / "cobranza-app/src/main/assets/index.html",
              root / "panel-apk/src/main/assets/index.html",
          ]
          for page in pages:
              if not page.is_file():
                  raise SystemExit(f"Falta la página del módulo: {page}")
              html = page.read_text(encoding="utf-8")
              # Quitar exclusivamente el control de navegación inyectado en la compilación anterior.
              html, buttons = re.subn(
                  r'<button\b[^>]*class=["\'][^"\']*dental-jg-back-panel[^"\']*["\'][^>]*>.*?</button>',
                  '', html, flags=re.I | re.S
              )
              html, styles = re.subn(
                  r'<style>[^<]*\.dental-jg-back-panel\s*\{.*?</style>',
                  '', html, flags=re.I | re.S
              )
              # Si el estilo tenía saltos de línea o reglas de foco, retirar el bloque completo.
              html = re.sub(r'<style>.*?dental-jg-back-panel.*?</style>', '', html, flags=re.I | re.S)
              page.write_text(html, encoding="utf-8")
              print(f"{page.relative_to(root)}: retirados {buttons} botones y {styles} estilos de regreso al panel.")
          panel = root / "panel-apk/src/main/assets/index.html"
          html = panel.read_text(encoding="utf-8")
          html = html.replace('<span class="brand-name">DENTAL JG</span>', '')
          html = html.replace('<span class="logo-text">DENTAL JG</span>', '')
          panel.write_text(html, encoding="utf-8")

          # Cobranza tampoco debe repetir la marca al lado del logotipo.
          cobranza = root / "cobranza-app/src/main/assets/index.html"
          html = cobranza.read_text(encoding="utf-8")
          html = html.replace("Cobranza DENTAL JG", "Cobranza")
          if "Cobranza DENTAL JG" in html or '<b>Cobranza</b>' not in html:
              raise SystemExit("No se pudo corregir el encabezado del módulo Cobranza.")
          cobranza.write_text(html, encoding="utf-8")
          print("Logotipo de Cobranza sin texto DENTAL JG duplicado.")
          print("No se insertará ningún botón 'Volver al panel' en los APK.")
          PY

