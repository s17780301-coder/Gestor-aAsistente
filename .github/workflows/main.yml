
name: Compilar DENTAL JG - Todas las aplicaciones

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-todas:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extraer ZIP DENTAL JG 10.5
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$GITHUB_WORKSPACE/DENTAL_JG_10_5_COBRANZA_Y_RECIBOS_RECIBO_CIRCULAR.zip"
          FUENTES="$RUNNER_TEMP/dental_jg_10_5"

          if [ ! -f "$ZIP" ]; then
            echo "::error::No se encontró el ZIP 10.5 en la raíz del repositorio."
            exit 1
          fi

          mkdir -p "$FUENTES"

          echo "Verificando ZIP..."
          unzip -t "$ZIP"

          echo "Extrayendo proyecto..."
          unzip -oq "$ZIP" -d "$FUENTES"

          echo "PROYECTO_FUENTES=$FUENTES" >> "$GITHUB_ENV"

      - name: Encontrar el proyecto integrado
        shell: bash
        run: |
          set -euo pipefail

          BASE="$PROYECTO_FUENTES"
          ROOT=""

          while IFS= read -r SETTINGS; do
            DIR="$(dirname "$SETTINGS")"
            TIENE_TRES=true

            for MODULO in gestor-app panel-apk cobranza-app; do
              if [ ! -f "$DIR/$MODULO/build.gradle" ] &&
                 [ ! -f "$DIR/$MODULO/build.gradle.kts" ]; then
                TIENE_TRES=false
                break
              fi
            done

            if [ "$TIENE_TRES" = true ]; then
              ROOT="$DIR"
              break
            fi
          done < <(
            find "$BASE" \
              -type d \( -name .git -o -name build \) -prune -o \
              -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print
          )

          if [ -z "$ROOT" ]; then
            echo "::error::No se encontró un proyecto con los tres módulos."
            echo "Carpetas encontradas:"
            find "$BASE" -maxdepth 5 -type d -print | head -200
            echo "Archivos Gradle encontrados:"
            find "$BASE" -type f \
              \( -name settings.gradle -o \
                 -name settings.gradle.kts -o \
                 -name build.gradle -o \
                 -name build.gradle.kts \) \
              -not -path '*/build/*' -print | head -200
            exit 1
          fi

          echo "Proyecto seleccionado: $ROOT"
          echo "PROYECTO_DIR=$ROOT" >> "$GITHUB_ENV"

      - name: Activar AndroidX
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVO="$PROYECTO_DIR/gradle.properties"
          touch "$ARCHIVO"

          if grep -q '^android.useAndroidX=' "$ARCHIVO"; then
            sed -i 's/^android.useAndroidX=.*/android.useAndroidX=true/' "$ARCHIVO"
          else
            echo 'android.useAndroidX=true' >> "$ARCHIVO"
          fi

          if grep -q '^android.enableJetifier=' "$ARCHIVO"; then
            sed -i 's/^android.enableJetifier=.*/android.enableJetifier=true/' "$ARCHIVO"
          else
            echo 'android.enableJetifier=true' >> "$ARCHIVO"
          fi

      - name: Verificar proyecto y Gradle
        shell: bash
        run: |
          set -euo pipefail

          echo "Proyecto: $PROYECTO_DIR"
          gradle --version

          for MODULO in gestor-app panel-apk cobranza-app; do
            if [ ! -d "$PROYECTO_DIR/$MODULO" ]; then
              echo "::error::No existe el módulo $MODULO."
              exit 1
            fi
          done

          echo "Los tres módulos están presentes."

      - name: Compilar Gestor, Panel y Cobranza
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/apk_final"

          for MODULO in gestor-app panel-apk cobranza-app; do
            echo ""
            echo "======================================"
            echo "Compilando: $MODULO"
            echo "======================================"

            gradle --no-daemon \
              -p "$PROYECTO_DIR" \
              ":$MODULO:assembleDebug"

            CARPETA="$PROYECTO_DIR/$MODULO/build/outputs/apk"

            if [ ! -d "$CARPETA" ]; then
              echo "::error::No se encontró la salida APK de $MODULO."
              exit 1
            fi

            APK="$(find "$CARPETA" -type f -name '*.apk' \
              -path '*/debug/*' -print -quit)"

            if [ -z "$APK" ] || [ ! -f "$APK" ]; then
              echo "::error::No se generó la APK de $MODULO."
              exit 1
            fi

            case "$MODULO" in
              gestor-app)
                NOMBRE="DENTAL-JG-Gestor.apk"
                ;;
              panel-apk)
                NOMBRE="DENTAL-JG-Panel-Administrativo.apk"
                ;;
              cobranza-app)
                NOMBRE="DENTAL-JG-Cobranza-Recibos.apk"
                ;;
            esac

            cp "$APK" "$RUNNER_TEMP/apk_final/$NOMBRE"
            echo "Generada: $NOMBRE"
          done

          echo "Las tres APK se generaron correctamente."

      - name: Publicar las tres APK
        uses: actions/upload-artifact@v4
        with:
          name: DENTAL-JG-Todas-Las-Apps
          path: ${{ runner.temp }}/apk_final/*.apk
          if-no-files-found: error
          
