
name: Compilar DENTAL JG - Todas las aplicaciones

on:
  push:
    branches:
      - main
    paths:
      - "*.zip"
      - ".github/workflows/main.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compilar-dental-jg
  cancel-in-progress: false

jobs:
  build:
    name: Compilar aplicaciones Android
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extraer proyecto Android
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p proyecto

          ZIP="$(find . -maxdepth 1 -type f -iname '*.zip' \
            ! -name 'DENTAL_JG_PANEL*' -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "::error::No se encontró un ZIP de las aplicaciones Android."
            echo "El ZIP del panel web no sirve para compilar APK."
            exit 1
          fi

          echo "ZIP Android seleccionado: $ZIP"
          unzip -q "$ZIP" -d proyecto

          SETTINGS="$(find proyecto -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "::error::El ZIP no contiene un proyecto Android Gradle."
            echo "Contenido encontrado:"
            find proyecto -maxdepth 4 -type f | head -n 100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proyecto Gradle encontrado: $PROJECT_DIR"

      - name: Compilar APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Verificar APK generados
        shell: bash
        run: |
          set -euo pipefail

          find proyecto -type f -path '*/build/outputs/apk/*.apk' \
            -print > apk-list.txt

          if [ ! -s apk-list.txt ]; then
            echo "::error::La compilación terminó sin generar APK."
            exit 1
          fi

          echo "APK generados:"
          cat apk-list.txt

      - name: Guardar APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: DENTAL-JG-APKs
          path: |
            proyecto/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
          
