name: Compilar Gestoria Asistente

on: workflow_dispatch

jobs:
build:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4

  - uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Extraer proyecto
    run: unzip -q GestoriaAsistente_v1.0_CORREGIDO.zip -d proyecto

  - name: Compilar APK
    run: gradle -p proyecto --no-daemon assembleDebug

  - uses: actions/upload-artifact@v4
    with:
      name: GestoriaAsistente-APK
      path: proyecto/app/build/outputs/apk/debug/app-debug.apk
