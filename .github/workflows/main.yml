name: Publicar panel DENTAL JG

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy.yml"
      - "index.html"
      - "app.js"
      - "config.js"
      - "users.js"
      - "styles.css"
      - "logo-dental-jg.png"
      - "assets/**"
      - "images/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Validar archivos del panel
        shell: bash
        run: |
          set -euo pipefail
          for f in index.html styles.css app.js config.js users.js logo-dental-jg.png; do
            test -s "$f" || { echo "::error::Falta archivo obligatorio: $f"; exit 1; }
          done
          grep -q 'app.js?v=10.8.99' index.html || { echo "::error::index.html no referencia el paquete 10.8.99"; exit 1; }
          grep -q 'register_dental_jg_payment' app.js || { echo "::error::No se encontró la operación transaccional de pagos"; exit 1; }
          grep -q 'No se hizo INSERT alternativo' app.js || { echo "::error::Falta protección frente a INSERT alternativo de pagos"; exit 1; }
          grep -q 'administrar-usuarios' users.js || { echo "::error::No se encontró el módulo de administración de usuarios"; exit 1; }
          echo "Validación básica completada."
      - name: Preparar sitio
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public
          cp index.html styles.css app.js config.js users.js logo-dental-jg.png public/
          for item in assets images css js; do
            [ ! -e "$item" ] || cp -a "$item" public/
          done
          touch public/.nojekyll
          test -s public/index.html
          echo "Archivos listos para publicar:"
          find public -maxdepth 4 -type f -printf '%P\n' | sort
      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar página
        id: deployment
        uses: actions/deploy-pages@v4
