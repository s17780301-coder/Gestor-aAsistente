name: Compilar DENTAL JG Cobranza - Una APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verificar proyecto
        run: |
          if [ ! -f settings.gradle ] && [ ! -f settings.gradle.kts ]; then
            echo "ERROR: Falta settings.gradle en la raiz"
            exit 1
          fi

          if [ ! -f app/build.gradle ] && [ ! -f app/build.gradle.kts ]; then
            echo "ERROR: Falta el modulo app de Cobranza"
            exit 1
          fi

      - name: Compilar APK de Cobranza
        run: gradle --no-daemon :app:assembleDebug

      - name: Publicar APK de Cobranza
        uses: actions/upload-artifact@v4
        with:
          name: DENTAL-JG-Cobranza-Recibos-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
