
name: Generar APK Gestoria Asistente

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  generar-apk:
    name: Compilar aplicacion Android
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permisos a Gradle
        run: chmod +x gradlew

      - name: Compilar APK
        run: ./gradlew assembleDebug

      - name: Guardar APK para descargar
        uses: actions/upload-artifact@v4
        with:
          nam
