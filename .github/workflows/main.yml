name: Compilar DENTAL JG - Flujo manual seguro

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compilar-dental-jg
  cancel-in-progress: false

jobs:
  build:
    name: Validar ZIP y compilar APK
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Localizar ZIP que contenga un proyecto Gradle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/candidatos" proyecto
          elegido=""
          n=0

          while IFS= read -r -d '' zipfile; do
            n=$((n + 1))
            destino="$RUNNER_TEMP/candidatos/zip-$n"
            mkdir -p "$destino"
            echo "Revisando ZIP: $zipfile"

            if ! unzip -q "$zipfile" -d "$destino"; then
              echo "Aviso: no se pudo extraer $zipfile; se omite."
              continue
            fi

            while IFS= read -r -d '' settings; do
              project_dir="$(dirname "$settings")"
              if find "$project_dir" -maxdepth 2 -type f \( -name build.gradle -o -name build.gradle.kts \) -print -quit | grep -q .; then
                elegido="$project_dir"
                echo "Proyecto Gradle válido: $settings"
                break 2
              fi
            done < <(find "$destino" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print0)
          done < <(find . -maxdepth 1 -type f -iname '*.zip' -print0 | sort -z)

          if [ -z "$elegido" ]; then
            echo "::error::No se encontró ningún ZIP raíz con un proyecto Gradle válido."
            echo "ZIP disponibles:"
            find . -maxdepth 1 -type f -iname '*.zip' -printf ' - %f (%s bytes)\n' || true
            exit 1
          fi

          cp -a "$elegido"/. proyecto/
          settings="$(find proyecto -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          test -n "$settings"
          project_dir="$(dirname "$settings")"
          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"
          echo "Proyecto seleccionado: $project_dir"

      - name: Compilar APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Verificar APK generados
        shell: bash
        run: |
          set -euo pipefail
          find proyecto -type f -path '*/build/outputs/apk/*.apk' -print > apk-list.txt
          if [ ! -s apk-list.txt ]; then
            echo "::error::La compilación terminó sin generar APK."
            exit 1
          fi
          echo "APK generados:"
          cat apk-list.txt

      - name: Guardar APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: DENTAL-JG-APKs-manual
          path: proyecto/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
