name: Publicar panel DENTAL JG v1.0
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Verificar y extraer DENTAL JG v1.0
        shell: bash
        run: |
          set -euo pipefail
          ZIP="DENTAL_JG_PANEL_1.0.zip"
          if [[ ! -s "$ZIP" ]]; then
            echo "ERROR: No existe $ZIP en la raíz del repositorio. No se publicará otra versión."
            exit 1
          fi
          mkdir -p extracted public
          unzip -t "$ZIP"
          unzip -o "$ZIP" -d extracted
          required=(index.html styles.css app.js config.js users.js logo-dental-jg.png)
          PANEL_DIR=""
          while IFS= read -r -d '' candidate; do
            dir="$(dirname "$candidate")"
            valid=1
            for file in "${required[@]}"; do
              [[ -s "$dir/$file" ]] || valid=0
            done
            if [[ "$valid" == 1 ]]; then PANEL_DIR="$dir"; break; fi
          done < <(find extracted -type f -name index.html -print0)
          if [[ -z "$PANEL_DIR" ]]; then
            echo "ERROR: El ZIP 1.0 no contiene todos los archivos requeridos."
            find extracted -type f | sort
            exit 1
          fi
          cp "$PANEL_DIR"/{index.html,styles.css,app.js,config.js,users.js,logo-dental-jg.png} public/
          echo "Contenido que se publicará desde DENTAL_JG_PANEL_1.0.zip:"
          sha256sum public/*
          test -s public/index.html

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
