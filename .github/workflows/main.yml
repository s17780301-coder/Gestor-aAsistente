name: Compilar DENTAL JG - Todas las aplicaciones

on:
  push:
    branches: [main]
    paths:
      - "*.zip"
      - ".github/workflows/main.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compilar-dental-jg
  cancel-in-progress: false

jobs:
  build:
    name: Localizar proyecto Android y compilar APK
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Encontrar ZIP que realmente contenga un proyecto Gradle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/candidatos" proyecto
          elegido=""
          n=0

          while IFS= read -r -d '' zipfile; do
            n=$((n + 1))
            destino="$RUNNER_TEMP/candidatos/zip-$n"
            mkdir -p "$destino"
            echo "Revisando archivo: $zipfile"

            if ! unzip -q "$zipfile" -d "$destino"; then
              echo "Aviso: no se pudo extraer $zipfile; se omite."
              continue
            fi

            settings="$(find "$destino" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
            if [ -n "$settings" ] && find "$(dirname "$settings")" -maxdepth 3 -type f \( -name build.gradle -o -name build.gradle.kts \) -print -quit | grep -q .; then
              elegido="$destino"
              echo "Proyecto Gradle encontrado en $settings"
              break
            fi
            echo "No contiene un proyecto Gradle válido: $zipfile"
          done < <(find . -maxdepth 1 -type f -iname '*.zip' -print0 | sort -z)

          if [ -z "$elegido" ]; then
            echo "::error::No hay ningún ZIP en la raíz que contenga settings.gradle/settings.gradle.kts y build.gradle/build.gradle.kts."
            echo "El ZIP del panel web no es un proyecto Android. Sube el ZIP maestro de las aplicaciones Android a la raíz de este repositorio y vuelve a ejecutar el flujo."
            echo "ZIP encontrados:"
            find . -maxdepth 1 -type f -iname '*.zip' -printf ' - %f (%s bytes)\n' || true
            exit 1
          fi

          cp -a "$elegido"/. proyecto/
          settings="$(find proyecto -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          test -n "$settings"
          project_dir="$(dirname "$settings")"
          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"
          echo "Proyecto seleccionado: $project_dir"

      - name: Compilar APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Verificar APK generados
        shell: bash
        run: |
          set -euo pipefail
          find proyecto -type f -path '*/build/outputs/apk/*.apk' -print > apk-list.txt
          if [ ! -s apk-list.txt ]; then
            echo "::error::La compilación terminó sin generar APK."
            exit 1
          fi
          echo "APK generados:"
          cat apk-list.txt

      - name: Guardar APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: DENTAL-JG-APKs
          path: proyecto/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
