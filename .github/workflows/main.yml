name: Compilar Gestoria Asistente

on:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Descargar archivos
uses: actions/checkout@v4

  - name: Configurar Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Configurar Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Extraer proyecto
    run: |
      unzip -q GestoriaAsistente_v1.0_CORREGIDO.zip -d proyecto
      test -f proyecto/settings.gradle

  - name: Compilar APK
    run: gradle -p proyecto --no-daemon assembleDebug

  - name: Guardar APK
    uses: actions/upload-artifact@v4
    with:
      name: GestoriaAsistente-APK
      path: proyecto/app/build/outputs/apk/debug/app-debug.apk
