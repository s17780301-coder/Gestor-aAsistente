
name: Compilar DENTAL JG Cobranza

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-cobranza:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Encontrar proyecto Android
        shell: bash
        run: |
          set -euo pipefail

          PROYECTO=""
          MODULO=""

          buscar_proyecto() {
            local BASE="$1"
            local SETTINGS DIR

            while IFS= read -r SETTINGS; do
              DIR="$(dirname "$SETTINGS")"

              if grep -Eq "include.*['\"]:app['\"]" "$SETTINGS" &&
                 { [ -f "$DIR/app/build.gradle" ] ||
                   [ -f "$DIR/app/build.gradle.kts" ]; }; then
                PROYECTO="$DIR"
                MODULO="app"
                return 0
              fi

              if grep -Eq "include.*['\"]:cobranza-app['\"]" "$SETTINGS" &&
                 { [ -f "$DIR/cobranza-app/build.gradle" ] ||
                   [ -f "$DIR/cobranza-app/build.gradle.kts" ]; }; then
                PROYECTO="$DIR"
                MODULO="cobranza-app"
                return 0
              fi
            done < <(
              find "$BASE" \
                -type d \( -name .git -o -name build \) -prune -o \
                -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print
            )
          }

          buscar_proyecto "." || true

          if [ -z "$PROYECTO" ]; then
            while IFS= read -r ZIP; do
              TEMP="$RUNNER_TEMP/cobranza_extraida"
              rm -rf "$TEMP"
              mkdir -p "$TEMP"

              if unzip -q "$ZIP" -d "$TEMP"; then
                buscar_proyecto "$TEMP" || true
              fi

              if [ -n "$PROYECTO" ]; then
                break
              fi
            done < <(find . -type f -iname "*.zip" ! -path "*/.git/*")
          fi

          if [ -z "$PROYECTO" ]; then
            echo "ERROR: No se encontró el proyecto Android."
            echo "Sube el contenido del proyecto o su ZIP al repositorio."
            exit 1
          fi

          echo "Proyecto: $PROYECTO"
          echo "Módulo: $MODULO"
          echo "PROYECTO_DIR=$PROYECTO" >> "$GITHUB_ENV"
          echo "MODULO=$MODULO" >> "$GITHUB_ENV"

      - name: Activar AndroidX
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVO="$PROYECTO_DIR/gradle.properties"
          touch "$ARCHIVO"

          grep -q '^android.useAndroidX=' "$ARCHIVO" \
            && sed -i 's/^android.useAndroidX=.*/android.useAndroidX=true/' "$ARCHIVO" \
            || echo 'android.useAndroidX=true' >> "$ARCHIVO"

          grep -q '^android.enableJetifier=' "$ARCHIVO" \
            || echo 'android.enableJetifier=true' >> "$ARCHIVO"

      - name: Compilar APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon \
            -p "$PROYECTO_DIR" \
            ":$MODULO:assembleDebug"

      - name: Preparar APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROYECTO_DIR/$MODULO/build/outputs/apk/debug/$MODULO-debug.apk"

          if [ ! -f "$APK" ]; then
            APK="$(find "$PROYECTO_DIR/$MODULO/build/outputs/apk" \
              -type f -name '*.apk' | head -n 1)"
          fi

          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "ERROR: La compilación terminó sin generar una APK."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/apk_final"
          cp "$APK" "$RUNNER_TEMP/apk_final/DENTAL-JG-Cobranza-Recibos.apk"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: DENTAL-JG-Cobranza-Recibos-APK
          path: ${{ runner.temp }}/apk_final/DENTAL-JG-Cobranza-Recibos.apk
          if-no-files-found: error
          
