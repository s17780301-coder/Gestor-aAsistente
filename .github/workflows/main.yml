name: Compilar DENTAL JG 10.8 - Todas las aplicaciones

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-todas:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Localizar y preparar el proyecto
        shell: bash
        run: |
          set -euo pipefail

          WORK="$GITHUB_WORKSPACE"
          FUENTES="$RUNNER_TEMP/dental_jg_fuentes"
          mkdir -p "$FUENTES"
          ROOT=""

          # Comprueba que una carpeta contiene los cuatro módulos.
          es_proyecto() {
            local dir="$1"
            local modulo

            if [[ ! -f "$dir/settings.gradle" && ! -f "$dir/settings.gradle.kts" ]]; then
              return 1
            fi

            for modulo in gestor-app panel-apk cobranza-app registro-app; do
              [[ -f "$dir/$modulo/src/main/AndroidManifest.xml" ]] || return 1
              [[ -f "$dir/$modulo/build.gradle" || -f "$dir/$modulo/build.gradle.kts" ]] || return 1
            done

            return 0
          }

          # PRIMERA OPCIÓN: buscar el proyecto ya extraído.
          while IFS= read -r -d '' SETTINGS; do
            DIR="$(dirname "$SETTINGS")"

            if es_proyecto "$DIR"; then
              ROOT="$DIR"
              break
            fi
          done < <(
            find "$WORK" \
              -type d \( -name .git -o -name build -o -name .gradle \) -prune -o \
              -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print0
          )

          # SEGUNDA OPCIÓN: buscar ZIP con cualquier nombre.
          if [[ -z "$ROOT" ]]; then
            ZIP=""

            while IFS= read -r -d '' CANDIDATO; do
              echo "Revisando ZIP: $CANDIDATO"

              if ! unzip -tq "$CANDIDATO" >/dev/null 2>&1; then
                echo "ZIP inválido; se omite."
                continue
              fi

              LISTA="$(unzip -Z1 "$CANDIDATO" 2>/dev/null || true)"

              if grep -Eq '(^|/)gestor-app/src/main/AndroidManifest.xml$' <<< "$LISTA" &&
                 grep -Eq '(^|/)panel-apk/src/main/AndroidManifest.xml$' <<< "$LISTA" &&
                 grep -Eq '(^|/)cobranza-app/src/main/AndroidManifest.xml$' <<< "$LISTA" &&
                 grep -Eq '(^|/)registro-app/src/main/AndroidManifest.xml$' <<< "$LISTA"; then
                ZIP="$CANDIDATO"
                break
              fi
            done < <(
              find "$WORK" \
                -type d \( -name .git -o -name .github \) -prune -o \
                -type f -iname '*.zip' -print0 | sort -z
            )

            if [[ -z "$ZIP" ]]; then
              echo "::error::No se encontró un proyecto completo ni un ZIP con las cuatro aplicaciones."
              echo "ZIP encontrados:"
              find "$WORK" \
                -type d -name .git -prune -o \
                -type f -iname '*.zip' -printf '%P\n' || true

              echo "Archivos Gradle encontrados:"
              find "$WORK" \
                -type d -name .git -prune -o \
                -type f \( -name settings.gradle -o -name settings.gradle.kts \) \
                -print | head -80 || true

              echo "Sube el ZIP completo de DENTAL JG al repositorio o añade el proyecto extraído."
              exit 1
            fi

            echo "ZIP seleccionado: $ZIP"
            unzip -oq "$ZIP" -d "$FUENTES"

            # Localizar la raíz Gradle después de extraer el ZIP.
            while IFS= read -r -d '' SETTINGS; do
              DIR="$(dirname "$SETTINGS")"

              if es_proyecto "$DIR"; then
                ROOT="$DIR"
                break
              fi
            done < <(
              find "$FUENTES" \
                -type d \( -name build -o -name .gradle \) -prune -o \
                -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print0
            )
          fi

          if [[ -z "$ROOT" ]]; then
            echo "::error::No se pudo localizar la raíz del proyecto con los cuatro módulos."
            exit 1
          fi

          echo "Proyecto seleccionado: $ROOT"
          echo "PROYECTO_DIR=$ROOT" >> "$GITHUB_ENV"

      - name: Activar AndroidX
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVO="$PROYECTO_DIR/gradle.properties"
          touch "$ARCHIVO"

          if grep -q '^android.useAndroidX=' "$ARCHIVO"; then
            sed -i 's/^android.useAndroidX=.*/android.useAndroidX=true/' "$ARCHIVO"
          else
            echo 'android.useAndroidX=true' >> "$ARCHIVO"
          fi

          if grep -q '^android.enableJetifier=' "$ARCHIVO"; then
            sed -i 's/^android.enableJetifier=.*/android.enableJetifier=true/' "$ARCHIVO"
          else
            echo 'android.enableJetifier=true' >> "$ARCHIVO"
          fi

      - name: Verificar proyecto y módulos
        shell: bash
        run: |
          set -euo pipefail

          echo "Proyecto: $PROYECTO_DIR"
          gradle --version

          if [[ ! -f "$PROYECTO_DIR/settings.gradle" && ! -f "$PROYECTO_DIR/settings.gradle.kts" ]]; then
            echo "::error::Falta settings.gradle o settings.gradle.kts."
            exit 1
          fi

          for MODULO in gestor-app panel-apk cobranza-app registro-app; do
            if [[ ! -f "$PROYECTO_DIR/$MODULO/src/main/AndroidManifest.xml" ]]; then
              echo "::error::Falta AndroidManifest.xml en $MODULO."
              exit 1
            fi

            if [[ ! -f "$PROYECTO_DIR/$MODULO/build.gradle" && ! -f "$PROYECTO_DIR/$MODULO/build.gradle.kts" ]]; then
              echo "::error::Falta build.gradle o build.gradle.kts en $MODULO."
              exit 1
            fi
          done

          echo "Los cuatro módulos están presentes."

          # Verifica que Gradle reconozca los módulos declarados.
          gradle --no-daemon -p "$PROYECTO_DIR" projects

      - name: Verificar archivos de Registro de Clientes
        shell: bash
        run: |
          set -euo pipefail

          REGISTRO="$PROYECTO_DIR/registro-app"

          for ARCHIVO in index.html app.js styles.css config.js manifest.webmanifest; do
            if [[ ! -f "$REGISTRO/src/main/assets/registro-web/$ARCHIVO" ]]; then
              echo "::error::Falta registro-app/src/main/assets/registro-web/$ARCHIVO"
              exit 1
            fi
          done

          echo "Los archivos web de Registro de Clientes están presentes."

      - name: Compilar las cuatro aplicaciones Android
        shell: bash
        run: |
          set -euo pipefail

          SALIDA="$RUNNER_TEMP/apk_final"
          mkdir -p "$SALIDA"

          for MODULO in gestor-app panel-apk cobranza-app registro-app; do
            echo "======================================"
            echo "Compilando: $MODULO"
            echo "======================================"

            gradle --no-daemon -p "$PROYECTO_DIR" ":$MODULO:assembleDebug"

            CARPETA="$PROYECTO_DIR/$MODULO/build/outputs/apk"

            APK="$(
              find "$CARPETA" \
                -type f -name '*.apk' -path '*/debug/*' \
                -print -quit 2>/dev/null || true
            )"

            if [[ -z "$APK" || ! -f "$APK" ]]; then
              echo "::error::No se generó la APK de $MODULO."

              find "$PROYECTO_DIR/$MODULO/build/outputs" \
                -maxdepth 6 -type f -print 2>/dev/null || true

              exit 1
            fi

            case "$MODULO" in
              gestor-app)
                NOMBRE="DENTAL-JG-Gestor.apk"
                ;;
              panel-apk)
                NOMBRE="DENTAL-JG-Panel-Administrativo.apk"
                ;;
              cobranza-app)
                NOMBRE="DENTAL-JG-Cobranza-Recibos.apk"
                ;;
              registro-app)
                NOMBRE="DENTAL-JG-Registro-de-Clientes.apk"
                ;;
            esac

            cp "$APK" "$SALIDA/$NOMBRE"
            echo "APK generada: $NOMBRE"
          done

          echo "Se generaron las cuatro APK."

      - name: Publicar las cuatro APK
        uses: actions/upload-artifact@v4
        with:
          name: DENTAL-JG-Cuatro-Apps-Android
          path: ${{ runner.temp }}/apk_final/*.apk
          if-no-files-found: error
          retention-days: 14
