
name: Compilar DENTAL JG - Todas las aplicaciones

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-todas:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Encontrar el proyecto con las tres aplicaciones
        shell: bash
        run: |
          set -euo pipefail

          FUENTES="$RUNNER_TEMP/dental_jg_fuentes"
          mkdir -p "$FUENTES"

          # Extraer los ZIP disponibles en el repositorio.
          while IFS= read -r ZIP; do
            NOMBRE="$(basename "$ZIP" .zip)"
            DESTINO="$FUENTES/$NOMBRE"
            mkdir -p "$DESTINO"
            echo "Revisando ZIP: $ZIP"
            unzip -oq "$ZIP" -d "$DESTINO"
          done < <(
            find . -type f -iname '*.zip' \
              ! -path '*/.git/*' \
              ! -path '*/build/*'
          )

          ROOT=""
          BUSCAR_EN=("$GITHUB_WORKSPACE" "$FUENTES")

          # Buscar primero un proyecto que contenga los tres módulos.
          for BASE in "${BUSCAR_EN[@]}"; do
            while IFS= read -r SETTINGS; do
              DIR="$(dirname "$SETTINGS")"

              TIENE_TRES=true
              for MODULO in gestor-app panel-apk cobranza-app; do
                if [ ! -f "$DIR/$MODULO/build.gradle" ] &&
                   [ ! -f "$DIR/$MODULO/build.gradle.kts" ]; then
                  TIENE_TRES=false
                  break
                fi
              done

              if [ "$TIENE_TRES" = true ]; then
                ROOT="$DIR"
                break 2
              fi
            done < <(
              find "$BASE" \
                -type d \( -name .git -o -name build \) -prune -o \
                -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print
            )
          done

          if [ -z "$ROOT" ]; then
            echo "ERROR: No encontré un proyecto que contenga los tres módulos:"
            echo "gestor-app, panel-apk y cobranza-app."
            echo "Comprueba que el ZIP del proyecto integrado esté en el repositorio."
            exit 1
          fi

          echo "Proyecto encontrado: $ROOT"
          echo "PROYECTO_DIR=$ROOT" >> "$GITHUB_ENV"

      - name: Activar AndroidX
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVO="$PROYECTO_DIR/gradle.properties"
          touch "$ARCHIVO"

          if grep -q '^android.useAndroidX=' "$ARCHIVO"; then
            sed -i 's/^android.useAndroidX=.*/android.useAndroidX=true/' "$ARCHIVO"
          else
            echo 'android.useAndroidX=true' >> "$ARCHIVO"
          fi

          if grep -q '^android.enableJetifier=' "$ARCHIVO"; then
            sed -i 's/^android.enableJetifier=.*/android.enableJetifier=true/' "$ARCHIVO"
          else
            echo 'android.enableJetifier=true' >> "$ARCHIVO"
          fi

      - name: Compilar Gestor, Panel y Cobranza
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/apk_final"

          for MODULO in gestor-app panel-apk cobranza-app; do
            echo "======================================"
            echo "Compilando módulo: $MODULO"
            echo "======================================"

            gradle --no-daemon \
              -p "$PROYECTO_DIR" \
              ":$MODULO:assembleDebug"

            CARPETA="$PROYECTO_DIR/$MODULO/build/outputs/apk"

            APK="$(find "$CARPETA" -type f -name '*.apk' \
              -path '*/debug/*' -print -quit)"

            if [ -z "$APK" ] || [ ! -f "$APK" ]; then
              echo "ERROR: No se generó la APK de $MODULO"
              exit 1
            fi

            case "$MODULO" in
              gestor-app)
                NOMBRE="DENTAL-JG-Gestor.apk"
                ;;
              panel-apk)
                NOMBRE="DENTAL-JG-Panel-Administrativo.apk"
                ;;
              cobranza-app)
                NOMBRE="DENTAL-JG-Cobranza-Recibos.apk"
                ;;
            esac

            cp "$APK" "$RUNNER_TEMP/apk_final/$NOMBRE"
            echo "APK generada: $NOMBRE"
          done

          echo "Las tres APK se generaron correctamente."

      - name: Publicar las tres APK
        uses: actions/upload-artifact@v4
        with:
          name: DENTAL-JG-Todas-Las-Apps
          path: ${{ runner.temp }}/apk_final/*.apk
          if-no-files-found: error
          
